          {showModal && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
              <form onSubmit={handleAddEntry} className="bg-white p-6 rounded-2xl border max-w-lg w-full max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900">Receive Stock to Central Depot</h3>
                    <p className="text-xs text-slate-500">Record inbound shipment with Supplier Invoice and PO Reference</p>
                  </div>
                  <button type="button" onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-700 text-sm font-bold">✕</button>
                </div>

                <div>
                  <label className="block text-xs font-semibold mb-1 text-slate-700">Select Material Item *</label>
                  <select 
                    value={selectedItemId} 
                    onChange={e => setSelectedItemId(e.target.value)} 
                    className="w-full p-2.5 border rounded-lg text-xs bg-white font-medium focus:ring-1 focus:ring-slate-900"
                  >
                    {items.map(i => <option key={i.id} value={i.id}>{i.itemCode} - {i.itemName}</option>)}
                  </select>
                </div>

                {/* Bounded preview card preventing long descriptions from hiding inputs */}
                {selectedItem && (
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs space-y-1">
                    <div className="flex items-center justify-between">
                      <span className="font-mono font-bold text-slate-900">{selectedItem.itemCode}</span>
                      <span className="text-[11px] font-mono font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                        Current Depot Balance: {getMainStock(selectedItem.id).availableBalance} {selectedItem.unit}
                      </span>
                    </div>
                    <div className="font-semibold text-slate-800 break-words">{selectedItem.itemName}</div>
                  </div>
                )}

                {/* Dedicated, high-contrast Quantity Box */}
                <div className="bg-emerald-50/70 border border-emerald-300 rounded-xl p-3.5 space-y-2 shrink-0">
                  <div className="flex items-center justify-between">
                    <label className="block text-xs font-bold text-slate-900">Received Quantity to Add *</label>
                    <span className="text-xs font-bold text-emerald-800">{selectedItem?.unit || 'Units'}</span>
                  </div>
                  <input 
                    type="number" 
                    required 
                    min="1" 
                    step="any"
                    value={qty} 
                    onChange={e => setQty(e.target.value)} 
                    placeholder="Enter received quantity" 
                    className="w-full p-2.5 border-2 border-emerald-500 bg-white rounded-lg text-base font-mono font-bold text-emerald-950 focus:outline-none focus:ring-2 focus:ring-emerald-700" 
                  />
                  <div className="flex items-center gap-1.5 pt-1 flex-wrap">
                    <span className="text-[10px] text-slate-500 font-semibold">Quick add:</span>
                    {[10, 50, 100, 500].map(amt => (
                      <button key={amt} type="button" onClick={() => setQty(String((Number(qty) || 0) + amt))} className="px-2 py-0.5 bg-white border border-slate-300 hover:bg-slate-100 rounded text-[11px] font-mono font-bold text-slate-700 cursor-pointer">
                        +{amt}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">PO / Reference No *</label>
                    <input required value={refNo} onChange={e => setRefNo(e.target.value)} className="w-full p-2 border rounded-lg text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Supplier Invoice No (Sup Inv No) *</label>
                    <input 
                      required 
                      value={supplierInvoiceNo} 
                      onChange={e => setSupplierInvoiceNo(e.target.value)} 
                      placeholder="e.g. INV-ACL-2026-88" 
                      className="w-full p-2 border rounded-lg text-xs font-mono font-bold text-blue-800" 
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Supplier Name</label>
                    <input value={supplier} onChange={e => setSupplier(e.target.value)} placeholder="e.g. ACL Cables / Prysmian / Tokyo Super" className="w-full p-2 border rounded-lg text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Delivery Date</label>
                    <input type="date" value={inwardDate} onChange={e => setInwardDate(e.target.value)} className="w-full p-2 border rounded-lg text-xs font-mono font-bold" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Received By (Officer)</label>
                    <input value={receivedBy} onChange={e => setReceivedBy(e.target.value)} className="w-full p-2 border rounded-lg text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Inspection Notes</label>
                    <input value={notes} onChange={e => setNotes(e.target.value)} placeholder="Quality passed / Lot verification" className="w-full p-2 border rounded-lg text-xs" />
                  </div>
                </div>

                <div className="flex gap-2 pt-2 border-t">
                  <button type="button" onClick={() => setShowModal(false)} className="flex-1 py-2 border rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 cursor-pointer">Cancel</button>
                  <button type="submit" className="flex-1 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold shadow-xs cursor-pointer">
                    Confirm & Print Voucher ➔
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- SITES VIEW (Includes Site Registration, Management, and Incoming Restock) ---
    function SitesView({ sites, onUpdateSites, isCentralAdmin, addAudit, items, getSiteStock, requests, onUpdateRequests, currentUser, onNavigateToUserForSite, onNavigateToReturn, siteAdjustments = [], onUpdateAdjustments }) {
      const [name, setName] = useState('');
      const [supervisor, setSupervisor] = useState('');
      const [location, setLocation] = useState('');
      const [phone, setPhone] = useState('');
      const [selectedSiteId, setSelectedSiteId] = useState(() => {
        if (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') {
          return currentUser.siteId;
        }
        return sites.find(s => !s.isMainWarehouse)?.id || sites[0]?.id || '';
      });

      // Yard Stock Adjustment Modal State
      const [showYardStockModal, setShowYardStockModal] = useState(false);
      const [adjItemId, setAdjItemId] = useState(items[0]?.id || '');
      const [adjQuantity, setAdjQuantity] = useState('10');
      const [adjReasonText, setAdjReasonText] = useState('Physical stock count at yard gate');

      const handleSaveYardStock = (e) => {
        e.preventDefault();
        const numQty = Number(adjQuantity);
        if (isNaN(numQty) || numQty === 0 || !adjItemId || !selectedSite) return;
        const itm = items.find(i => i.id === adjItemId);
        const newAdj = {
          id: 'adj-' + Date.now(),
          siteId: selectedSite.id,
          siteName: selectedSite.name,
          itemId: adjItemId,
          itemCode: itm?.itemCode || '',
          itemName: itm?.itemName || '',
          quantity: numQty,
          date: new Date().toISOString(),
          reason: adjReasonText.trim() || 'Yard stock adjustment'
        };
        if (onUpdateAdjustments) {
          onUpdateAdjustments([newAdj, ...(siteAdjustments || [])]);
        }
        addAudit('YARD_STOCK_ADJUSTMENT', `ADJ-${Date.now().toString().slice(-4)}`, selectedSite.name, `Added/Adjusted ${numQty > 0 ? '+' : ''}${numQty} ${itm?.unit} of ${itm?.itemCode}. (${adjReasonText})`);
        alert(`✓ Added ${numQty} ${itm?.unit} of ${itm?.itemCode} to ${selectedSite.name} yard stock!`);
        setShowYardStockModal(false);
        setAdjQuantity('10');
      };

      const handleAddSite = (e) => {
        e.preventDefault();
        const trimmedName = name.trim();
        if (sites.some(s => s.name.toLowerCase() === trimmedName.toLowerCase())) {
          alert(`Site name "${trimmedName}" already exists!`);
          return;
        }
        const newSite = {
          id: 'site-' + Date.now(),
          name: trimmedName,
          supervisorName: supervisor.trim(),
          location: location.trim(),
          contactNumber: phone.trim() || '+94 77 000 0000',
          isMainWarehouse: false
        };
        onUpdateSites([...sites, newSite]);
        addAudit('SITE_CREATED', newSite.name, newSite.name, `Added site branch ${newSite.name}`);
        alert(`Site branch "${newSite.name}" registered successfully in Firebase!`);
        setSelectedSiteId(newSite.id);
        setName(''); setSupervisor(''); setLocation(''); setPhone('');
      };

      const handleDeleteSite = (s) => {
        if (s.isMainWarehouse) {
          alert("Main Central Warehouse is a core system facility and cannot be deleted!");
          return;
        }
        if (!confirm(`Are you sure you want to delete site branch "${s.name}"? This will remove it from the system.`)) return;
        const updated = sites.filter(x => x.id !== s.id);
        onUpdateSites(updated);
        addAudit('SITE_DELETED', s.name, s.name, `Removed site branch ${s.name}`);
        if (selectedSiteId === s.id) {
          setSelectedSiteId(updated[0]?.id || '');
        }
      };

      const selectedSite = sites.find(s => s.id === selectedSiteId) || sites[0];

      // Incoming shipments in transit for this specific site
      const incomingShipments = requests.filter(r => r.siteId === selectedSiteId && r.status === 'Approved');

      const handleDirectReceiveShipment = (req) => {
        const updated = requests.map(r => r.id === req.id ? { ...r, status: 'Accepted' } : r);
        onUpdateRequests(updated);
        addAudit('REQUEST_ACCEPTED', req.requestNoteNumber, selectedSite?.name || 'Site', `Direct received into site yard stock.`);
        alert(`Shipment ${req.requestNoteNumber} received! Site stock updated.`);
      };

      const isUserAssignedYard = !isCentralAdmin && currentUser?.siteId === selectedSite?.id;

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
                  {isCentralAdmin ? 'Admin Site Control' : 'Yard Inventory'}
                </span>
                <h1 className="text-xl font-bold text-slate-900">Site Branches & Yard Balances</h1>
              </div>
              <p className="text-xs text-slate-600 mt-1">Register field yards, inspect local stock balances, and accept incoming approved shipments.</p>
            </div>
            <div className="text-xs font-mono font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">
              Total Yards: {sites.length}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {isCentralAdmin ? (
              <form onSubmit={handleAddSite} className="lg:col-span-4 bg-white p-5 rounded-xl border border-slate-200 space-y-3.5 shadow-xs">
                <h3 className="font-bold text-sm text-slate-900 border-b pb-2 flex items-center justify-between">
                  <span>+ Register New Site Branch</span>
                  <span className="text-[10px] text-emerald-600 font-mono">Firebase Live</span>
                </h3>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Site / Branch Name *</label>
                  <input required value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Jaffna Grid Transmission Yard" className="w-full px-3 py-2 border rounded-lg text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Supervisor / Foreman Name *</label>
                  <input required value={supervisor} onChange={e => setSupervisor(e.target.value)} placeholder="e.g. K. Sivakumar" className="w-full px-3 py-2 border rounded-lg text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Yard Location / Address *</label>
                  <input required value={location} onChange={e => setLocation(e.target.value)} placeholder="e.g. A9 Highway Station Depot, Yard #3" className="w-full px-3 py-2 border rounded-lg text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Contact Phone</label>
                  <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="+94 77 123 4567" className="w-full px-3 py-2 border rounded-lg text-xs focus:ring-1 focus:ring-slate-900 focus:outline-none" />
                </div>
                <button type="submit" className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold transition-colors shadow-xs cursor-pointer">
                  Save New Site Branch ➔
                </button>
              </form>
            ) : (
              <div className="lg:col-span-4 bg-white p-6 rounded-xl border border-slate-200 text-center space-y-3">
                <div className="w-12 h-12 mx-auto rounded-full bg-blue-50 border border-blue-200 flex items-center justify-center text-xl">🏢</div>
                <h3 className="font-bold text-sm text-slate-900">Your Assigned Yard Depot</h3>
                <div className="p-3 bg-slate-50 rounded-xl border text-xs text-left space-y-1">
                  <div className="font-bold text-slate-900">{sites.find(s => s.id === currentUser?.siteId)?.name || 'Branch'}</div>
                  <div className="text-slate-600">{sites.find(s => s.id === currentUser?.siteId)?.location || 'Field Location'}</div>
                  <div className="text-[11px] text-blue-600 font-mono mt-1">🔒 Locked to your user profile</div>
                </div>
                <p className="text-[11px] text-slate-500">You have read-only visibility into other yard balances to check material availability.</p>
              </div>
            )}

            <div className="lg:col-span-8 space-y-4">
              <div className="flex gap-2 flex-wrap">
                {sites.map(s => {
                  const isSelected = selectedSiteId === s.id;
                  const isAssigned = !isCentralAdmin && currentUser?.siteId === s.id;
                  return (
                    <button 
                      key={s.id} 
                      onClick={() => setSelectedSiteId(s.id)} 
                      className={`px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all flex items-center gap-1.5 cursor-pointer ${
                        isSelected ? 'bg-slate-900 text-white border-slate-900 shadow-xs' : 'bg-white text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      {s.isMainWarehouse && <span>⚡</span>}
                      <span>{s.name}</span>
                      {isAssigned && <span className="px-1.5 py-0.2 rounded text-[10px] bg-blue-500 text-white font-mono">My Yard</span>}
                    </button>
                  );
                })}
              </div>

              {selectedSite && (
                <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-4 shadow-xs">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <h3 className="font-bold text-base text-slate-900">{selectedSite.name}</h3>
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${selectedSite.isMainWarehouse ? 'bg-purple-100 text-purple-800 border border-purple-200' : 'bg-slate-100 text-slate-700'}`}>
                          {selectedSite.isMainWarehouse ? 'Central Warehouse HQ' : 'Field Yard Branch'}
                        </span>
                      </div>
                      <div className="text-xs text-slate-500 mt-0.5">
                        Supervisor: <strong>{selectedSite.supervisorName}</strong> · Location: {selectedSite.location} · Contact: {selectedSite.contactNumber}
                      </div>
                    </div>
                    {isCentralAdmin && (
                      <div className="flex items-center gap-2">
                        {!selectedSite.isMainWarehouse && onNavigateToUserForSite && (
                          <button
                            type="button"
                            onClick={() => onNavigateToUserForSite(selectedSite.id)}
                            className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-800 rounded-lg text-xs font-bold transition-colors cursor-pointer"
                            title="Register a user specifically assigned to this site"
                          >
                            + Add User for Site
                          </button>
                        )}
                        {!selectedSite.isMainWarehouse && (
                          <button 
                            type="button"
                            onClick={() => handleDeleteSite(selectedSite)}
                            className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 border border-rose-300 text-rose-700 rounded-lg text-xs font-bold transition-colors cursor-pointer"
                          >
                            Delete Yard
                          </button>
                        )}
                      </div>
                    )}
                  </div>

                  {/* INCOMING SHIPMENTS IN TRANSIT BANNER */}
                  {incomingShipments.length > 0 && (
                    <div className="bg-gradient-to-r from-blue-50 to-emerald-50 border border-blue-200 rounded-xl p-4 space-y-3">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="text-base">🚚</span>
                          <div>
                            <h4 className="font-bold text-xs text-slate-900">Incoming Approved Shipments in Transit ({incomingShipments.length})</h4>
                            <p className="text-[11px] text-slate-600">Dispatched from Central Warehouse. Click receive to restock site yard.</p>
                          </div>
                        </div>
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800 border border-blue-300">Ready to Receive</span>
                      </div>
                      <div className="space-y-2">
                        {incomingShipments.map(req => (
                          <div key={req.id} className="bg-white p-3 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
                            <div>
                              <div className="font-mono font-bold text-slate-900">{req.requestNoteNumber}</div>
                              <div className="text-[11px] text-slate-600 mt-0.5">
                                {(req.items || []).map(i => `${i.itemCode}: +${i.approvedQty !== undefined ? i.approvedQty : i.requestedQty} ${i.unit}`).join(', ')}
                              </div>
                            </div>
                            <button onClick={() => handleDirectReceiveShipment(req)} className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-bold text-xs flex items-center gap-1 shadow-2xs">
                              ✓ Receive into Site Yard
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                    <h4 className="text-xs font-bold text-slate-800">Current Material Balances Held at This Yard</h4>
                    <div className="flex items-center gap-2">
                      <button 
                        type="button" 
                        onClick={() => { setAdjItemId(items[0]?.id || ''); setShowYardStockModal(true); }}
                        className="px-2.5 py-1 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-lg text-xs flex items-center gap-1 cursor-pointer shadow-2xs"
                        title="Add opening stock or adjust physical inventory for this yard"
                      >
                        <span>⚡ Add / Adjust Yard Stock</span>
                      </button>
                      {!selectedSite.isMainWarehouse && (
                        <button 
                          type="button" 
                          onClick={() => onNavigateToReturn && onNavigateToReturn(selectedSite.id)}
                          className="text-xs text-blue-700 hover:text-blue-900 font-bold flex items-center gap-1 hover:underline cursor-pointer"
                        >
                          <span>🔄 Return Excess</span> ➔
                        </button>
                      )}
                    </div>
                  </div>
                  <div className="overflow-x-auto max-h-[300px]">
                    <table className="w-full text-xs text-left">
                      <thead className="bg-slate-50 border-b">
                        <tr>
                          <th className="py-2 px-2.5">Item Code</th>
                          <th className="py-2 px-2.5">Item Name</th>
                          <th className="py-2 px-2.5 text-right">Total Received</th>
                          <th className="py-2 px-2.5 text-right">Issued to Teams</th>
                          <th className="py-2 px-2.5 text-right">Returned to Main</th>
                          <th className="py-2 px-2.5 text-right font-bold">Yard Balance</th>
                          <th className="py-2 px-2.5 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {items.filter(i => getSiteStock(selectedSite.id, i.id).hasActivity).length === 0 ? (
                          <tr><td colSpan="7" className="py-6 text-center text-slate-400">No stock received into this yard yet.</td></tr>
                        ) : (
                          items.filter(i => getSiteStock(selectedSite.id, i.id).hasActivity).map(i => {
                            const stk = getSiteStock(selectedSite.id, i.id);
                            return (
                              <tr key={i.id} className="hover:bg-slate-50">
                                <td className="py-2 px-2.5 font-mono font-bold text-slate-900">{i.itemCode}</td>
                                <td className="py-2 px-2.5 text-slate-800">{i.itemName}</td>
                                <td className="py-2 px-2.5 text-right font-mono">{stk.received} {i.unit}</td>
                                <td className="py-2 px-2.5 text-right font-mono text-slate-500">{stk.issued} {i.unit}</td>
                                <td className="py-2 px-2.5 text-right font-mono text-amber-700">
                                  {stk.returnedToMain > 0 ? `-${stk.returnedToMain} ${i.unit}` : '0'}
                                </td>
                                <td className={`py-2 px-2.5 text-right font-mono font-bold ${stk.availableBalance > 0 ? 'text-emerald-700' : 'text-slate-400'}`}>
                                  {stk.availableBalance} {i.unit}
                                </td>
                                <td className="py-2 px-2.5 text-right">
                                  {!selectedSite.isMainWarehouse && (
                                    <button 
                                      type="button" 
                                      onClick={() => onNavigateToReturn && onNavigateToReturn(selectedSite.id)}
                                      className="px-2 py-0.5 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold border border-blue-200 rounded text-[10px] cursor-pointer"
                                      title="Return materials back to Main Central Warehouse"
                                    >
                                      Return to Main ➔
                                    </button>
                                  )}
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* SITES VIEW YARD STOCK ADJUST MODAL */}
          {showYardStockModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl border border-slate-200 animate-in fade-in zoom-in-95">
                <div className="flex items-center justify-between border-b pb-3">
                  <div>
                    <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
                      <span>⚡ Add / Adjust Yard Stock</span>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-mono">
                        {selectedSite?.name || 'Yard'}
                      </span>
                    </h3>
                    <p className="text-[11px] text-slate-500">Record initial opening inventory, physical count, or project surplus.</p>
                  </div>
                  <button 
                    type="button" 
                    onClick={() => setShowYardStockModal(false)}
                    className="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveYardStock} className="space-y-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Target Site Yard</label>
                    <div className="p-2 bg-slate-50 border rounded-lg text-xs font-bold text-slate-800">
                      📍 {selectedSite?.name} ({selectedSite?.location || 'Site'})
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Select Item to Restock / Adjust</label>
                    <select 
                      value={adjItemId} 
                      onChange={e => setAdjItemId(e.target.value)} 
                      className="w-full p-2 border rounded-lg text-xs bg-white font-medium"
                    >
                      {items.map(i => (
                        <option key={i.id} value={i.id}>
                          {i.itemCode} - {i.itemName} (Current: {getSiteStock(selectedSite.id, i.id).availableBalance} {i.unit})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Quantity to Add * 
                      <span className="text-[10px] text-slate-500 font-normal ml-1">(e.g. +10, +50)</span>
                    </label>
                    <input 
                      type="number" 
                      required 
                      value={adjQuantity} 
                      onChange={e => setAdjQuantity(e.target.value)} 
                      placeholder="e.g. 10" 
                      className="w-full p-2 border rounded-lg text-xs font-mono font-bold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Reason / Reference</label>
                    <input 
                      type="text" 
                      value={adjReasonText} 
                      onChange={e => setAdjReasonText(e.target.value)} 
                      placeholder="e.g. Physical inventory count / Opening stock" 
                      className="w-full p-2 border rounded-lg text-xs"
                    />
                  </div>

                  <div className="flex gap-2 pt-2 border-t">
                    <button 
                      type="button" 
                      onClick={() => setShowYardStockModal(false)}
                      className="flex-1 py-2 border rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 cursor-pointer"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="flex-1 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold cursor-pointer shadow-xs active:scale-[0.99]"
                    >
                      Save to Yard Stock ➔
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- REQUESTS VIEW (Admin sets Approved Qty, Branch Filter, Site Receives) ---
    function RequestsView({ items, sites, requests, onUpdateRequests, currentUser, isCentralAdmin, getMainStock, addAudit, onOpenPrintVoucher }) {
      const [showModal, setShowModal] = useState(false);
      const defaultSite = (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') 
        ? currentUser.siteId 
        : (sites.find(s => !s.isMainWarehouse)?.id || sites[0]?.id);
      const [siteId, setSiteId] = useState(defaultSite);
      const [selectedRows, setSelectedRows] = useState([]);
      const [searchItem, setSearchItem] = useState('');
      
      // Admin filter & modal state
      const [branchFilter, setBranchFilter] = useState('all');
      const [statusFilter, setStatusFilter] = useState('all');
      const [reviewingReq, setReviewingReq] = useState(null);
      const [itemsInReview, setItemsInReview] = useState([]);
      const [approvedQtys, setApprovedQtys] = useState({});
      const [dispatchNotes, setDispatchNotes] = useState('');

      // Receiving modal state for site user
      const [receivingReq, setReceivingReq] = useState(null);
      const [receivedQtys, setReceivedQtys] = useState({});
      const [receivingNotes, setReceivingNotes] = useState('');

      const branchSites = sites.filter(s => !s.isMainWarehouse);

      // Filtering requests: non-admin is strictly isolated to their own branch
      const visibleRequests = requests.filter(r => {
        if (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') {
          if (r.siteId !== currentUser.siteId) return false;
        } else if (branchFilter !== 'all' && r.siteId !== branchFilter) {
          return false;
        }
        if (statusFilter === 'all') return true;
        return r.status === statusFilter;
      });

      const handleAddRow = (item) => {
        if (selectedRows.some(r => r.itemId === item.id)) return;
        setSelectedRows([...selectedRows, { itemId: item.id, itemCode: item.itemCode, itemName: item.itemName, unit: item.unit, quantity: 10 }]);
      };

      const handleCreateRequest = (e) => {
        e.preventDefault();
        if (selectedRows.length === 0) { alert("Select at least one item."); return; }
        const targetSiteId = (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') 
          ? currentUser.siteId 
          : siteId;

        const seq = requests.length + 1;
        const paddedSeq = String(seq).padStart(3, '0');
        const reqDocNo = `REQ-2026-${paddedSeq}`;
        const supDocNo = `SUP-2026-${paddedSeq}`;
        const rcvDocNo = `RCV-2026-${paddedSeq}`;

        const newReq = {
          id: 'sr-' + Date.now(),
          docSeq: seq,
          requestDocNo: reqDocNo,
          supplyDocNo: supDocNo,
          receivedDocNo: rcvDocNo,
          requestNoteNumber: reqDocNo,
          requestedDate: new Date().toISOString(),
          requestedBy: currentUser.fullName,
          siteId: targetSiteId,
          status: 'Pending',
          items: selectedRows.map(r => ({
            itemId: r.itemId,
            itemCode: r.itemCode,
            itemName: r.itemName,
            unit: r.unit,
            requestedQty: Number(r.quantity),
            approvedQty: Number(r.quantity)
          }))
        };
        onUpdateRequests([newReq, ...requests]);
        addAudit('REQUEST_CREATED', newReq.requestNoteNumber, sites.find(s => s.id === targetSiteId)?.name || 'Site', `Created request ${newReq.requestDocNo} for ${selectedRows.length} items (Linked Supply: ${supDocNo}).`);
        setShowModal(false);
        setSelectedRows([]);
      };

      // Open Admin Review & Set Approved Quantity Modal
      const openReviewModal = (req) => {
        setReviewingReq(req);
        setItemsInReview([...(req.items || [])]);
        const initial = {};
        (req.items || []).forEach(row => {
          const avail = getMainStock(row.itemId).availableBalance;
          // If out of stock in Main Branch, approvedQty MUST be 0
          initial[row.itemId] = avail <= 0 ? 0 : Math.min(row.requestedQty, avail);
        });
        setApprovedQtys(initial);
        setDispatchNotes('');
      };

      // Allow admin to remove unavailable / out-of-stock items from the request
      const handleRemoveItemFromReq = (itemId) => {
        const itemToRemove = itemsInReview.find(i => i.itemId === itemId);
        if (!itemToRemove) return;
        const filtered = itemsInReview.filter(i => i.itemId !== itemId);
        setItemsInReview(filtered);
        const nextApproved = { ...approvedQtys };
        delete nextApproved[itemId];
        setApprovedQtys(nextApproved);
      };

      const handleConfirmApproval = () => {
        if (!reviewingReq) return;
        if (itemsInReview.length === 0) {
          alert("No items remain in this requisition. You can reject the request or cancel review.");
          return;
        }

        // Validate that no out-of-stock item is allocated quantity
        for (const row of itemsInReview) {
          const avail = getMainStock(row.itemId).availableBalance;
          const allocated = Number(approvedQtys[row.itemId] ?? 0);
          if (avail <= 0 && allocated > 0) {
            alert(`Cannot approve ${row.itemCode}: Main Depot stock is 0. Please remove this item from the request or allocate 0.`);
            return;
          }
          if (allocated > avail) {
            alert(`Cannot approve ${row.itemCode}: Allocated quantity (${allocated}) exceeds Main Depot stock (${avail}).`);
            return;
          }
        }

        // Only retain and dispatch materials that are in stock with positive approved quantity
        const finalApprovedItems = itemsInReview
          .map(row => ({
            ...row,
            approvedQty: Math.max(0, Number(approvedQtys[row.itemId] ?? 0))
          }))
          .filter(row => row.approvedQty > 0);

        if (finalApprovedItems.length === 0) {
          alert("Cannot approve: No available items are allocated for dispatch (depot stock is 0 for all items). Please restock Main Depot or reject the requisition.");
          return;
        }

        const removedCount = (reviewingReq.items || []).length - finalApprovedItems.length;
        const notes = dispatchNotes.trim() + (removedCount > 0 ? ` (${removedCount} unavailable item(s) excluded from dispatch).` : '');

        const updated = requests.map(r => r.id === reviewingReq.id ? {
          ...r,
          status: 'Approved',
          approvalDate: new Date().toISOString(),
          approvalNotes: notes,
          items: finalApprovedItems
        } : r);

        onUpdateRequests(updated);
        addAudit('REQUEST_APPROVED', reviewingReq.requestNoteNumber, 'Central Warehouse', `Approved ${finalApprovedItems.length} available items for dispatch.${removedCount > 0 ? ` Excluded ${removedCount} out-of-stock items.` : ''}`);
        setReviewingReq(null);
        setItemsInReview([]);
      };

      const handleRejectRequest = () => {
        if (!reviewingReq) return;
        if (!confirm(`Reject requisition note ${reviewingReq.requestNoteNumber}? The destination site will see this request was rejected due to unavailable stock.`)) return;
        const updated = requests.map(r => r.id === reviewingReq.id ? {
          ...r,
          status: 'Rejected',
          rejectionDate: new Date().toISOString(),
          approvalNotes: dispatchNotes.trim() || 'Rejected due to items being out of stock at Main Central Warehouse.'
        } : r);
        onUpdateRequests(updated);
        addAudit('REQUEST_REJECTED', reviewingReq.requestNoteNumber, 'Central Warehouse', `Rejected requisition due to insufficient central stock.`);
        setReviewingReq(null);
        setItemsInReview([]);
      };

      // Open Site Receiving Count/Edit Modal
      const openReceivingModal = (req) => {
        setReceivingReq(req);
        const initial = {};
        (req.items || []).forEach(row => {
          initial[row.itemId] = row.receivedQty !== undefined ? row.receivedQty : (row.approvedQty !== undefined ? row.approvedQty : row.requestedQty);
        });
        setReceivedQtys(initial);
        setReceivingNotes('');
      };

      const handleConfirmReceipt = () => {
        if (!receivingReq) return;
        const updatedItems = (receivingReq.items || []).map(row => ({
          ...row,
          receivedQty: Math.max(0, Number(receivedQtys[row.itemId] ?? (row.approvedQty ?? row.requestedQty)))
        }));

        const updated = requests.map(r => r.id === receivingReq.id ? {
          ...r,
          status: 'Accepted',
          acceptanceDate: new Date().toISOString(),
          acceptanceNotes: receivingNotes.trim() || 'Verified physical arrival at yard gate.',
          items: updatedItems
        } : r);

        onUpdateRequests(updated);
        addAudit('REQUEST_ACCEPTED', receivingReq.requestNoteNumber, sites.find(s => s.id === receivingReq.siteId)?.name || 'Site', `Counted and received shipment into site inventory.`);
        setReceivingReq(null);
      };

      // 1-Click Direct Full Accept
      const handleDirectAccept = (req) => {
        const updated = requests.map(r => r.id === req.id ? {
          ...r,
          status: 'Accepted',
          acceptanceDate: new Date().toISOString(),
          acceptanceNotes: 'Direct accepted full dispatched stock at site yard.'
        } : r);
        onUpdateRequests(updated);
        addAudit('REQUEST_ACCEPTED', req.requestNoteNumber, sites.find(s => s.id === req.siteId)?.name || 'Site', `Direct accepted into site stock.`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900">Site Stock Requisitions & Allocations</h1>
              <p className="text-xs text-slate-600">Review branch requisitions, allocate central warehouse quantities, and receive shipments at site.</p>
            </div>
            <button onClick={() => setShowModal(true)} className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold shadow-xs cursor-pointer">
              + New Stock Request Note
            </button>
          </div>

          {/* Filter Bar */}
          <div className="bg-white p-3 rounded-xl border flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
            {isCentralAdmin ? (
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <span className="font-semibold text-slate-600">Branch Filter:</span>
                <select value={branchFilter} onChange={e => setBranchFilter(e.target.value)} className="p-1.5 border rounded-lg bg-white font-medium">
                  <option value="all">All Site Branches (Consolidated)</option>
                  {branchSites.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                </select>
              </div>
            ) : (
              <div className="flex items-center gap-2 px-3 py-1.5 bg-blue-50 border border-blue-200 rounded-lg text-xs font-semibold text-blue-900">
                <span>📍 Branch:</span>
                <span>{sites.find(s => s.id === currentUser?.siteId)?.name || 'Assigned Yard'}</span>
                <span className="text-[10px] text-blue-600 font-mono">(🔒 Locked to your yard)</span>
              </div>
            )}

            <div className="flex items-center gap-1.5 flex-wrap">
              {['all', 'Pending', 'Approved', 'Accepted'].map(st => (
                <button
                  key={st}
                  onClick={() => setStatusFilter(st)}
                  className={`px-2.5 py-1 rounded-md font-semibold transition-colors ${
                    statusFilter === st ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                  }`}
                >
                  {st === 'all' ? 'All' : st === 'Approved' ? 'In-Transit' : st}
                </button>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl border overflow-hidden">
            <table className="w-full text-xs text-left">
              <thead className="bg-slate-50 text-slate-700 border-b">
                <tr>
                  <th className="py-2.5 px-3">Doc # & Linked Chain</th>
                  <th className="py-2.5 px-3">Target Site</th>
                  <th className="py-2.5 px-3 min-w-[220px]">Materials (Requested ➔ Approved ➔ Received)</th>
                  <th className="py-2.5 px-3">Status</th>
                  <th className="py-2.5 px-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {visibleRequests.length === 0 ? (
                  <tr><td colSpan="5" className="py-8 text-center text-slate-400">No requisitions matching selected filters.</td></tr>
                ) : (
                  visibleRequests.map(r => {
                    const targetSite = sites.find(s => s.id === r.siteId);
                    const reqIdx = requests.indexOf(r);
                    const seq = r.docSeq || (reqIdx >= 0 ? reqIdx + 1 : 1);
                    const paddedSeq = String(seq).padStart(3, '0');
                    const reqDocNo = r.requestDocNo || r.requestNoteNumber || `REQ-2026-${paddedSeq}`;
                    const supDocNo = r.supplyDocNo || `SUP-2026-${paddedSeq}`;
                    const rcvDocNo = r.receivedDocNo || `RCV-2026-${paddedSeq}`;

                    return (
                      <tr key={r.id} className="hover:bg-slate-50/70">
                        <td className="py-2.5 px-3">
                          <div className="font-mono font-bold text-slate-900">{reqDocNo}</div>
                          <div className="text-[10px] text-slate-500 font-mono mt-0.5 space-y-0.5">
                            <div>
                              <span>🔗 Supply: </span>
                              <span className={r.status === 'Approved' || r.status === 'Accepted' ? 'text-blue-700 font-bold' : 'text-slate-400'}>
                                {supDocNo} {r.status === 'Approved' ? '(Dispatched)' : ''}
                              </span>
                            </div>
                            <div>
                              <span>🔗 Received: </span>
                              <span className={r.status === 'Accepted' ? 'text-emerald-700 font-bold' : 'text-slate-400'}>
                                {rcvDocNo} {r.status === 'Accepted' ? '(Gate Confirmed)' : ''}
                              </span>
                            </div>
                          </div>
                        </td>
                        <td className="py-2.5 px-3 font-semibold text-slate-800">{targetSite?.name || 'Site'}</td>
                        <td className="py-2.5 px-3">
                          <div className="space-y-1">
                            {(r.items || []).map(i => (
                              <div key={i.itemId} className="flex items-center gap-1.5 text-[11px]">
                                <span className="font-mono font-bold">{i.itemCode}:</span>
                                <span>{i.requestedQty} {i.unit} req.</span>
                                {i.approvedQty !== undefined && <span className="text-emerald-700 font-bold bg-emerald-50 px-1 rounded">➔ Apprv: {i.approvedQty}</span>}
                                {i.receivedQty !== undefined && <span className="text-blue-700 font-bold bg-blue-50 px-1 rounded">✓ Recv: {i.receivedQty}</span>}
                              </div>
                            ))}
                          </div>
                        </td>
                        <td className="py-2.5 px-3">
                          <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${
                            r.status === 'Accepted' ? 'bg-emerald-100 text-emerald-800' :
                            r.status === 'Approved' ? 'bg-blue-100 text-blue-800 animate-pulse' : 'bg-amber-100 text-amber-800'
                          }`}>
                            {r.status === 'Approved' ? '🚚 In-Transit' : r.status === 'Accepted' ? '✓ Stocked' : '⏳ Pending'}
                          </span>
                        </td>
                        <td className="py-2.5 px-3 text-right">
                          <div className="flex flex-col sm:flex-row items-end sm:items-center justify-end gap-1.5">
                            {/* PRINT LETTERHEAD VOUCHERS */}
                            <div className="flex items-center gap-1">
                              <button 
                                type="button" 
                                onClick={() => onOpenPrintVoucher && onOpenPrintVoucher(r, 'request')} 
                                className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 rounded text-[11px] font-bold flex items-center gap-1 cursor-pointer"
                                title="Print Material Request Letterhead Voucher (Comtec PDF format)"
                              >
                                <span>🖨️</span>
                                <span>Req Doc</span>
                              </button>
                              {(r.status === 'Approved' || r.status === 'Accepted') && (
                                <button 
                                  type="button" 
                                  onClick={() => onOpenPrintVoucher && onOpenPrintVoucher(r, 'supply')} 
                                  className="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-200 rounded text-[11px] font-bold flex items-center gap-1 cursor-pointer"
                                  title="Print Material Supply / Dispatch Voucher"
                                >
                                  <span>🚚</span>
                                  <span>Supply Doc</span>
                                </button>
                              )}
                              {r.status === 'Accepted' && (
                                <button 
                                  type="button" 
                                  onClick={() => onOpenPrintVoucher && onOpenPrintVoucher(r, 'received')} 
                                  className="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded text-[11px] font-bold flex items-center gap-1 cursor-pointer"
                                  title="Print Goods Received Note (GRN) Voucher"
                                >
                                  <span>📥</span>
                                  <span>GRN Doc</span>
                                </button>
                              )}
                            </div>

                            {/* WORKFLOW ACTIONS */}
                            {r.status === 'Pending' && isCentralAdmin && (
                              <button onClick={() => openReviewModal(r)} className="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold shadow-2xs">
                                Review & Allocate Qty
                              </button>
                            )}
                            {r.status === 'Approved' && (
                              <>
                                <button onClick={() => openReceivingModal(r)} className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 border rounded-lg text-xs font-semibold">
                                  Count / Edit
                                </button>
                                <button onClick={() => handleDirectAccept(r)} className="px-3 py-1 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold shadow-2xs">
                                  ✓ Receive into Yard
                                </button>
                              </>
                            )}
                            {r.status === 'Accepted' && (
                              <span className="text-emerald-700 font-semibold text-[11px]">✓ Received & Restocked</span>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>

          {/* ADMIN REVIEW & SET APPROVED QUANTITY MODAL */}
          {reviewingReq && (
            <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
              <div className="bg-white rounded-2xl border max-w-2xl w-full p-6 space-y-4 max-h-[92vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                      <span>Review & Allocate Stock for Dispatch</span>
                      <span className="text-xs px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold">Central Depot</span>
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">Requisition: <strong className="font-mono">{reviewingReq.requestNoteNumber}</strong> · Target Site: <strong className="text-slate-800">{sites.find(s => s.id === reviewingReq.siteId)?.name}</strong></p>
                  </div>
                  <button onClick={() => { setReviewingReq(null); setItemsInReview([]); }} className="text-slate-400 hover:text-slate-700 text-sm font-bold">✕</button>
                </div>

                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900 flex items-start gap-2.5">
                  <span className="text-base shrink-0">ℹ️</span>
                  <div>
                    <div className="font-bold">Stock Availability Rule (තොග නීතිය):</div>
                    <div>Only items currently available in the Main Central Warehouse can be approved. Items with 0 stock cannot be dispatched. Click <strong>"Remove from Request"</strong> to remove unavailable items so in-stock goods can be dispatched.</div>
                  </div>
                </div>

                <div className="border rounded-xl overflow-hidden">
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-50 border-b">
                      <tr>
                        <th className="p-2.5">Requested Material</th>
                        <th className="p-2.5 text-right">Main Depot Stock</th>
                        <th className="p-2.5 text-right">Requested</th>
                        <th className="p-2.5 text-right w-52 font-bold">Approved to Dispatch</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {itemsInReview.length === 0 ? (
                        <tr>
                          <td colSpan="4" className="p-6 text-center text-slate-400">
                            All items have been removed from this request note.
                          </td>
                        </tr>
                      ) : (
                        itemsInReview.map(row => {
                          const avail = getMainStock(row.itemId).availableBalance;
                          const isOutOfStock = avail <= 0;
                          const currentApproved = approvedQtys[row.itemId] ?? (isOutOfStock ? 0 : Math.min(row.requestedQty, avail));

                          return (
                            <tr key={row.itemId} className={isOutOfStock ? "bg-rose-50/40" : "hover:bg-slate-50"}>
                              <td className="p-2.5">
                                <div className="font-mono font-bold text-slate-900">{row.itemCode}</div>
                                <div className="text-[11px] text-slate-600 truncate max-w-[150px]">{row.itemName}</div>
                              </td>
                              <td className="p-2.5 text-right font-mono">
                                {isOutOfStock ? (
                                  <span className="px-1.5 py-0.5 bg-rose-100 text-rose-700 font-bold rounded text-[11px] border border-rose-200">
                                    0 {row.unit} (Out of Stock)
                                  </span>
                                ) : (
                                  <span className="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 font-bold rounded text-[11px] border border-emerald-200">
                                    {avail} {row.unit}
                                  </span>
                                )}
                              </td>
                              <td className="p-2.5 text-right font-mono text-slate-600 font-semibold">
                                {row.requestedQty} {row.unit}
                              </td>
                              <td className="p-2.5 text-right">
                                {isOutOfStock ? (
                                  <div className="flex flex-col items-end gap-1.5">
                                    <div className="text-[10px] text-rose-600 font-bold bg-rose-100/80 px-1.5 py-0.5 rounded">
