                  {/* Row 3: Issue No & Revision Matrix */}
                  <tr>
                    <td colSpan="2" className="p-1 border-r border-black">
                      <div className="grid grid-cols-2 text-[9px] gap-x-2">
                        <div>Issue NO: <strong className="font-mono">{activeTemplate.issueNo || '01'}</strong></div>
                        <div>Date Of Issue: <span className="font-mono">{localData.date}</span></div>
                        <div>Revision No: <strong className="font-mono">{activeTemplate.revisionNo || '00'}</strong></div>
                        <div>Date of Rev: <span className="font-mono">{localData.date}</span></div>
                      </div>
                    </td>
                    <td className="p-1 border-r border-black">
                      <div className="text-[8.5px] text-slate-500">Reviewed By</div>
                      {revSig && (
                        <div className="h-6 flex items-center justify-start my-0.2">
                          <img src={revSig.signatureDataUrl} alt="Reviewed Signature" className="max-h-5 max-w-[90px] object-contain mix-blend-multiply" />
                        </div>
                      )}
                      <div className="font-bold text-[9.5px]">{activeTemplate.reviewedBy || 'Dissanayake'}</div>
                    </td>
                    <td className="p-1">
                      <div className="text-[8.5px] text-slate-500">Approved BY</div>
                      {apprSig && (
                        <div className="h-6 flex items-center justify-start my-0.2">
                          <img src={apprSig.signatureDataUrl} alt="Approved Signature" className="max-h-5 max-w-[90px] object-contain mix-blend-multiply" />
                        </div>
                      )}
                      <div className="font-bold text-[9.5px]">{activeTemplate.approvedBy || 'Arthur Vance'}</div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            {/* Bottom Form ID Print Watermark */}
            <div className="flex justify-between items-center text-[8px] text-slate-500 font-mono mt-1 pt-1 border-t border-slate-200">
              <span>Form Ref: CTS-MAT-REQ-022 / QP 2B MATALE</span>
              <span>Generated via Apex Stock Management System · Comtec Systems Letterhead</span>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // --- PRINT & LETTERHEAD CENTER VIEW (Tri-Tab: Documents, Templates, Signatures) ---
    // =========================================================================
    function LetterheadCenterView({
      templates,
      activeTemplateId,
      onSelectTemplate,
      onUpdateTemplates,
      digitalSignatures = [],
      onUpdateDigitalSignatures,
      requests,
      siteReturns,
      teamIssues,
      teamReturns,
      mainStockEntries,
      items,
      sites,
      currentUser,
      isCentralAdmin,
      onOpenPrintForRequest,
      onOpenPrintForReturn,
      onOpenPrintForInward,
      onOpenPrintForManual,
      getSiteStock,
      getMainStock
    }) {
      const [hubTab, setHubTab] = useState('documents'); // 'documents' | 'templates' | 'signatures'
      const [sectionFilter, setSectionFilter] = useState('all'); // 'all' | 'requests' | 'supplies' | 'received' | 'returns' | 'inward'
      const [searchQuery, setSearchQuery] = useState('');

      // In-app Alert / Toast notification banner state (replaces window.alert)
      const [statusNotice, setStatusNotice] = useState('');

      // In-app Delete Template Confirmation state (replaces window.confirm)
      const [deleteConfirmTemplate, setDeleteConfirmTemplate] = useState(null);

      // Template Editor / Creation state
      const [editingTemplate, setEditingTemplate] = useState(null);
      const [tplName, setTplName] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [subtitle, setSubtitle] = useState('');
      const [tel, setTel] = useState('');
      const [fax, setFax] = useState('');
      const [email, setEmail] = useState('');
      const [address, setAddress] = useState('');
      const [logoText, setLogoText] = useState('COM');
      const [designeePrep, setDesigneePrep] = useState('Site In-Charge');
      const [designeeAppr, setDesigneeAppr] = useState('Central Project Engineer');
      const [deptPrep, setDeptPrep] = useState('Civil & Telecom Operations');
      const [deptAppr, setDeptAppr] = useState('Central Logistics Depot');
      const [issueNo, setIssueNo] = useState('01');
      const [revNo, setRevNo] = useState('00');
      const [reviewedBy, setReviewedBy] = useState('Dissanayake');
      const [approvedBy, setApprovedBy] = useState('Arthur Vance');

      // Digital Signature Management State
      const [showSigModal, setShowSigModal] = useState(false);
      const [sigInputMode, setSigInputMode] = useState('upload'); // 'upload' | 'draw'
      const [newSigName, setNewSigName] = useState('');
      const [newSigRole, setNewSigRole] = useState('Central Project Engineer');
      const [newSigDept, setNewSigDept] = useState('Central Logistics & Procurement');
      const [newSigDataUrl, setNewSigDataUrl] = useState('');
      const [deleteConfirmSigId, setDeleteConfirmSigId] = useState(null);

      // Populate form when editing an existing template
      const handleStartEditTemplate = (tpl) => {
        setEditingTemplate(tpl);
        setTplName(tpl.templateName || '');
        setCompanyName(tpl.companyName || '');
        setSubtitle(tpl.subtitle || '');
        setTel(tpl.tel || '');
        setFax(tpl.fax || '');
        setEmail(tpl.email || '');
        setAddress(tpl.address || '');
        setLogoText(tpl.logoText || 'COM');
        setDesigneePrep(tpl.designeePrepared || 'Site In-Charge');
        setDesigneeAppr(tpl.designeeApproved || 'Central Project Engineer');
        setDeptPrep(tpl.departmentPrepared || 'Civil & Telecom Operations');
        setDeptAppr(tpl.departmentApproved || 'Central Logistics Depot');
        setIssueNo(tpl.issueNo || '01');
        setRevNo(tpl.revisionNo || '00');
        setReviewedBy(tpl.reviewedBy || 'Dissanayake');
        setApprovedBy(tpl.approvedBy || 'Arthur Vance');
      };

      const handleStartNewTemplate = () => {
        setEditingTemplate({ id: 'new' });
        setTplName('');
        setCompanyName('NEW CONTRACTING COMPANY (PVT) LTD.');
        setSubtitle('General Civil Engineering, Telecommunication Infrastructure, Heavy Machinery & Material Supply Contractors.');
        setTel('+94 11 2345678');
        setFax('+94 11 2345679');
        setEmail('info@contractor.lk');
        setAddress('No: 100, Station Road, Colombo, Sri Lanka.');
        setLogoText('NCC');
        setDesigneePrep('Site Engineer');
        setDesigneeAppr('Project Director');
        setDeptPrep('Engineering Division');
        setDeptAppr('Procurement Division');
        setIssueNo('01');
        setRevNo('00');
        setReviewedBy(currentUser?.fullName || 'Engineer');
        setApprovedBy('Project Director');
      };

      const handleSaveTemplate = (e) => {
        e.preventDefault();
        if (!tplName.trim()) {
          setStatusNotice("Please enter a Template Name (e.g. 'Comtec Systems Standard', 'Dialog Contractor Format').");
          return;
        }

        const templateData = {
          id: editingTemplate.id === 'new' ? 'tpl-' + Date.now() : editingTemplate.id,
          templateName: tplName.trim(),
          companyName: companyName.trim(),
          subtitle: subtitle.trim(),
          tel: tel.trim(),
          fax: fax.trim(),
          email: email.trim(),
          address: address.trim(),
          logoText: logoText.trim() || 'CO',
          designeePrepared: designeePrep.trim(),
          designeeApproved: designeeAppr.trim(),
          departmentPrepared: deptPrep.trim(),
          departmentApproved: deptAppr.trim(),
          issueNo: issueNo.trim() || '01',
          revisionNo: revNo.trim() || '00',
          reviewedBy: reviewedBy.trim(),
          approvedBy: approvedBy.trim(),
          paperSize: 'a4',
          orientation: 'portrait'
        };

        let updatedList = [];
        if (editingTemplate.id === 'new') {
          updatedList = [...templates, templateData];
        } else {
          updatedList = templates.map(t => t.id === templateData.id ? templateData : t);
        }

        onUpdateTemplates(updatedList);
        onSelectTemplate(templateData.id);
        setEditingTemplate(null);
        setStatusNotice(`✓ Template "${templateData.templateName}" saved successfully!`);
      };

      const handleExecuteDeleteTemplate = (tpl) => {
        if (templates.length <= 1) {
          setStatusNotice("⚠️ You must keep at least one letterhead template.");
          setDeleteConfirmTemplate(null);
          return;
        }
        const filtered = templates.filter(t => t.id !== tpl.id);
        onUpdateTemplates(filtered);
        if (activeTemplateId === tpl.id) {
          onSelectTemplate(filtered[0].id);
        }
        setDeleteConfirmTemplate(null);
        setStatusNotice(`✓ Template "${tpl.templateName}" was deleted.`);
      };

      // Scanned Image File Upload
      const handleFileUploadSignature = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          setNewSigDataUrl(evt.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSaveNewSignature = (e) => {
        e.preventDefault();
        if (!newSigName.trim()) {
          setStatusNotice("Please enter Signer Full Name.");
          return;
        }
        if (!newSigDataUrl) {
          setStatusNotice("Please upload a scanned signature or draw on the pad.");
          return;
        }

        const newSig = {
          id: 'sig-' + Date.now(),
          name: newSigName.trim(),
          role: newSigRole.trim() || 'Operations Officer',
          department: newSigDept.trim() || 'Logistics & Engineering',
          signatureDataUrl: newSigDataUrl,
          createdAt: new Date().toISOString()
        };

        const updated = [...digitalSignatures, newSig];
        if (onUpdateDigitalSignatures) onUpdateDigitalSignatures(updated);
        setShowSigModal(false);
        setNewSigName('');
        setNewSigDataUrl('');
        setStatusNotice(`✓ Digital signature for "${newSig.name}" added to signature library.`);
      };

      const handleDeleteSignature = (sigId) => {
        const updated = digitalSignatures.filter(s => s.id !== sigId);
        if (onUpdateDigitalSignatures) onUpdateDigitalSignatures(updated);
        setDeleteConfirmSigId(null);
        setStatusNotice("✓ Signature removed from library.");
      };

      // Compile master document list from requests, returns, and mainStock inward entries
      const compiledDocs = useMemo(() => {
        const list = [];

        // 1. Requests (and their linked supplies and receipts)
        requests.forEach((r, idx) => {
          const site = sites.find(s => s.id === r.siteId);
          const seq = r.docSeq || (idx + 1);
          const paddedSeq = String(seq).padStart(3, '0');
          const reqNo = r.requestDocNo || r.requestNoteNumber || `REQ-2026-${paddedSeq}`;
          const supNo = r.supplyDocNo || `SUP-2026-${paddedSeq}`;
          const rcvNo = r.receivedDocNo || `RCV-2026-${paddedSeq}`;

          // Always add Request
          list.push({
            id: 'req-' + r.id,
            section: 'requests',
            docNumber: reqNo,
            docType: 'Material Request Requisition',
            linkedReq: reqNo,
            linkedSupply: supNo,
            linkedReceived: rcvNo,
            siteName: site?.name || 'Site Yard',
            date: r.requestedDate || '',
            itemsSummary: (r.items || []).map(i => `${i.itemCode} (${i.requestedQty} ${i.unit})`).join(', '),
            status: r.status,
            rawReq: r,
            printMode: 'request'
          });

          // If Approved or Accepted, add Supply
          if (r.status === 'Approved' || r.status === 'Accepted') {
            list.push({
              id: 'sup-' + r.id,
              section: 'supplies',
              docNumber: supNo,
              docType: 'Material Supply Note (Main Depot)',
              linkedReq: reqNo,
              linkedSupply: supNo,
              linkedReceived: rcvNo,
              siteName: site?.name || 'Site Yard',
              date: r.approvalDate || r.requestedDate || '',
              itemsSummary: (r.items || []).map(i => `${i.itemCode} (${i.approvedQty ?? i.requestedQty} ${i.unit})`).join(', '),
              status: r.status === 'Approved' ? 'Dispatched' : 'Delivered & Accepted',
              rawReq: r,
              printMode: 'supply'
            });
          }

          // If Accepted, add Received (GRN)
          if (r.status === 'Accepted') {
            list.push({
              id: 'rcv-' + r.id,
              section: 'received',
              docNumber: rcvNo,
              docType: 'Material Goods Received (GRN)',
              linkedReq: reqNo,
              linkedSupply: supNo,
              linkedReceived: rcvNo,
              siteName: site?.name || 'Site Yard',
              date: r.acceptanceDate || r.approvalDate || '',
              itemsSummary: (r.items || []).map(i => `${i.itemCode} (${i.receivedQty ?? i.approvedQty ?? i.requestedQty} ${i.unit})`).join(', '),
              status: 'Gate Restocked',
              rawReq: r,
              printMode: 'received'
            });
          }
        });

        // 2. Returns to Main Central Warehouse
        siteReturns.forEach((ret, idx) => {
          const site = sites.find(s => s.id === ret.sourceSiteId);
          const seq = idx + 1;
          const retNo = ret.returnVoucherNumber || `RET-2026-${String(seq).padStart(3, '0')}`;
          list.push({
            id: 'ret-' + ret.id,
            section: 'returns',
            docNumber: retNo,
            docType: 'Material Return to Main Warehouse',
            linkedReq: ret.linkedRequestNo || 'REF-REQ',
            linkedSupply: ret.linkedSupplyNo || 'REF-SUP',
            linkedReceived: '-',
            siteName: site?.name || ret.sourceSiteName || 'Site Yard',
            date: ret.returnDate || ret.timestamp || '',
            itemsSummary: `${ret.itemCode || 'Material'} (${ret.quantity} ${ret.unit}) · ${ret.condition}`,
            status: 'Credited to Main Depot',
            rawRet: ret,
            printMode: 'return'
          });
        });

        // 3. Inbound Supplier Shipments (Main Depot GRN)
        mainStockEntries.forEach((entry, idx) => {
          const itm = items.find(i => i.id === entry.itemId);
          const docNo = entry.inwardDocNo || `GRN-2026-${String(idx + 1).padStart(3, '0')}`;
          const entryDate = entry.date || (entry.timestamp ? entry.timestamp.split('T')[0] : '');
          list.push({
            id: 'inw-' + entry.id,
            section: 'inward',
            docNumber: docNo,
            docType: 'Supplier Inbound Goods Received (GRN)',
            linkedReq: `PO: ${entry.referenceNo || 'N/A'}`,
            linkedSupply: `Inv: ${entry.supplierInvoiceNo || entry.supInvNo || 'N/A'}`,
            linkedReceived: docNo,
            siteName: 'Central Logistics Depot',
            date: entryDate,
            itemsSummary: `${itm?.itemCode || 'Material'} (+${entry.quantity} ${itm?.unit || 'Nos'}) · ${entry.supplier || 'Vendor'}`,
            status: 'Central Stocked',
            rawEntry: entry,
            rawItem: itm,
            printMode: 'inward'
          });
        });

        return list;
      }, [requests, siteReturns, mainStockEntries, sites, items]);

      // Filtered documents
      const filteredDocs = compiledDocs.filter(d => {
        if (sectionFilter !== 'all' && d.section !== sectionFilter) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          return (
            d.docNumber.toLowerCase().includes(q) ||
            d.siteName.toLowerCase().includes(q) ||
            d.itemsSummary.toLowerCase().includes(q) ||
            d.linkedReq.toLowerCase().includes(q) ||
            d.linkedSupply.toLowerCase().includes(q)
          );
        }
        return true;
      });

      return (
        <div className="space-y-6">
          {/* Header Banner */}
          <div className="bg-white p-5 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800 border border-blue-200">
                  Document Hub
                </span>
                <h1 className="text-xl font-bold text-slate-900">Print & Letterhead Management Center</h1>
              </div>
              <p className="text-xs text-slate-600 mt-1">
                Official Comtec Systems (Pvt) Ltd letterhead vouchers, customizable contractor formats, digital signatures, and auto-linked document workflow tracking.
              </p>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              <button 
                type="button"

              <div className="bg-white p-5 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs">
                <div>
                  <h3 className="font-bold text-base text-slate-900 flex items-center gap-2">
                    <span>🖋️</span>
                    <span>Digital Signatures & Approvals Library</span>
                  </h3>
                  <p className="text-xs text-slate-600 mt-1">
                    Upload scanned signatures or draw digital signatures to attach to official letterheads, Goods Received Notes (GRN), and site requisitions.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => {
                    setShowSigModal(true);
                    setNewSigName('');
                    setNewSigDataUrl('');
                  }}
                  className="px-3.5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold transition-all shadow-xs cursor-pointer flex items-center gap-1.5"
                >
                  <span>+</span>
                  <span>Add / Scan New Signature</span>
                </button>
              </div>

              {/* Signatures Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {digitalSignatures.map(sig => (
                  <div key={sig.id} className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex flex-col justify-between space-y-3">
                    <div className="space-y-2">
                      <div className="flex items-center justify-between">
                        <span className="font-bold text-sm text-slate-900">{sig.name}</span>
                        <span className="text-[10px] font-mono text-slate-400">
                          {sig.createdAt ? sig.createdAt.split('T')[0] : 'Saved'}
                        </span>
                      </div>
                      <div className="text-xs text-slate-600">{sig.role}</div>
                      <div className="text-[11px] text-slate-400">{sig.department}</div>
                    </div>

                    {/* Signature Preview Canvas Box */}
                    <div className="h-20 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-center p-2 overflow-hidden">
                      {sig.signatureDataUrl ? (
                        <img 
                          src={sig.signatureDataUrl} 
                          alt={`Signature for ${sig.name}`} 
                          className="max-h-16 max-w-full object-contain mix-blend-multiply" 
                        />
                      ) : (
                        <span className="text-xs text-slate-400 italic">No image</span>
                      )}
                    </div>

                    <div className="flex items-center justify-between pt-2 border-t text-xs">
                      <span className="text-[10px] text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
                        Ready for Letterhead
                      </span>
                      {digitalSignatures.length > 1 && (
                        <button
                          type="button"
                          onClick={() => setDeleteConfirmSigId(sig.id)}
                          className="text-rose-600 hover:text-rose-800 font-semibold cursor-pointer text-xs"
                        >
                          Remove
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>

              {/* ADD NEW SIGNATURE MODAL */}
              {showSigModal && (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 backdrop-blur-xs">
                  <form onSubmit={handleSaveNewSignature} className="bg-white p-6 rounded-2xl border max-w-md w-full shadow-2xl space-y-4">
                    <div className="flex items-center justify-between border-b pb-3">
                      <div>
                        <h4 className="font-bold text-sm text-slate-900">Add Digital Signature</h4>
                        <p className="text-[11px] text-slate-500">Scan physical signature or draw on screen</p>
                      </div>
                      <button type="button" onClick={() => setShowSigModal(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Signer Full Name *</label>
                      <input 
                        required 
                        value={newSigName} 
                        onChange={e => setNewSigName(e.target.value)} 
                        placeholder="e.g. Arthur Vance / Dissanayake" 
                        className="w-full px-3 py-1.5 border rounded-lg text-xs font-bold" 
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Role / Designation</label>
                        <input 
                          value={newSigRole} 
                          onChange={e => setNewSigRole(e.target.value)} 
                          placeholder="Central Project Engineer" 
                          className="w-full px-2.5 py-1.5 border rounded-lg text-xs" 
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Department</label>
                        <input 
                          value={newSigDept} 
                          onChange={e => setNewSigDept(e.target.value)} 
                          placeholder="Logistics & Operations" 
                          className="w-full px-2.5 py-1.5 border rounded-lg text-xs" 
                        />
                      </div>
                    </div>

                    {/* Input Mode Switcher: Upload Image vs Draw */}
                    <div className="flex border rounded-lg overflow-hidden text-xs font-bold">
                      <button
                        type="button"
                        onClick={() => setSigInputMode('upload')}
                        className={`flex-1 py-1.5 cursor-pointer ${
                          sigInputMode === 'upload' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'
                        }`}
                      >
                        📷 Scan / Upload Image
                      </button>
                      <button
                        type="button"
                        onClick={() => setSigInputMode('draw')}
                        className={`flex-1 py-1.5 cursor-pointer ${
                          sigInputMode === 'draw' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700'
                        }`}
                      >
                        ✍️ Draw on Pad
                      </button>
                    </div>

                    {sigInputMode === 'upload' ? (
                      <div className="space-y-2">
                        <label className="block text-xs font-semibold text-slate-700">
                          Upload Signature Image (PNG, JPG, or Scanned Document crop)
                        </label>
                        <input 
                          type="file" 
                          accept="image/*" 
                          onChange={handleFileUploadSignature}
                          className="block w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-900 file:text-white cursor-pointer"
                        />
                        {newSigDataUrl && (
                          <div className="h-20 bg-slate-50 border border-slate-300 rounded-lg p-2 flex items-center justify-center">
                            <img src={newSigDataUrl} alt="Preview" className="max-h-16 max-w-full object-contain" />
                          </div>
                        )}
                      </div>
                    ) : (
                      <SignaturePadCanvas
                        onSaveSignature={(dataUrl) => setNewSigDataUrl(dataUrl)}
                        onCancel={() => setSigInputMode('upload')}
                      />
                    )}

                    <div className="flex gap-2 pt-2 border-t">
                      <button 
                        type="button" 
                        onClick={() => setShowSigModal(false)}
                        className="flex-1 py-2 border rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 cursor-pointer"
                      >
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        disabled={!newSigDataUrl || !newSigName.trim()}
                        className={`flex-1 py-2 font-bold rounded-lg text-xs shadow-xs cursor-pointer ${
                          newSigDataUrl && newSigName.trim() ? 'bg-emerald-700 hover:bg-emerald-800 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        }`}
                      >
                        Save Signature ➔
                      </button>
                    </div>
                  </form>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }
    function LoginView({ users, onLogin, config, themeId, bgEffect, onThemeChange, onBgEffectChange, themes, bgEffects }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [showPass, setShowPass] = useState(false);

      const activeTheme = (themes || THEMES).find(t => t.id === (themeId || 'emerald')) || THEMES[0];
      const activeBgEffect = bgEffect || 'ambient-orbs';

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');
        const cleanUser = username.trim().toLowerCase();
        const found = users.find(u => u.username.toLowerCase() === cleanUser);
        
        if (!found) {
          setError('User not found / පරිශීලක නාමය හමු නොවීය. කරුණාකර නිවැරදි Username එක ඇතුළත් කරන්න.');
          return;
        }

        const enteredPass = password.trim();
        const expectedPass = found.password ? found.password.trim() : '';
        const isMatch = (enteredPass === expectedPass) || 
          (found.username.toLowerCase() === 'admin' && (enteredPass === 'password123' || enteredPass === 'admin123'));

        if (!isMatch) {
          setError('Incorrect password / මුරපදය වැරදිය. කරුණාකර නිවැරදි Password එක ලබාදෙන්න.');
          return;
        }

        onLogin(found);
      };

      return (
        <div className={`min-h-screen ${activeTheme.headerBg} flex flex-col justify-center items-center p-4 relative overflow-hidden transition-colors`}>
          {/* Animated Background Effect */}
          <AnimatedProjectBackground effect={activeBgEffect} theme={activeTheme} />

          <div className="max-w-md w-full space-y-6 relative z-10">
            {/* Branding Header */}
            <div className="text-center space-y-2">
              <div className="flex justify-center">
                <CompanyLogoBadge config={config} theme={activeTheme} className="w-16 h-16" textClassName="text-3xl" />
              </div>
              <h1 className="text-2xl font-black text-white tracking-tight">{config.companyName || 'Comtec Systems'}</h1>
              <p className={`text-sm font-semibold ${activeTheme.headerSubText}`}>{config.systemName || 'Apex Stock & Site Management System'}</p>
              <p className="text-xs text-slate-400">Enterprise Multi-Tenant Stock Control & Field Yard Requisition Hub</p>
            </div>

            {/* Login Card */}
            <div className={`bg-slate-900/95 border ${activeTheme.cardBorder || 'border-slate-700'} backdrop-blur-md p-6 sm:p-8 rounded-2xl shadow-2xl space-y-5 transition-colors`}>
              <div className="border-b border-slate-700/80 pb-3">
                <h2 className="text-base font-bold text-white flex items-center justify-between">
                  <span>Sign In to System (පද්ධතියට ඇතුල් වීම)</span>
                  <span className="text-[10px] text-emerald-400 font-mono">🔒 Secure Access</span>
                </h2>
                <p className="text-xs text-slate-400 mt-0.5">Please enter your username & password to access your assigned workspace.</p>
              </div>

              {error && (
                <div className="p-3 bg-rose-500/15 border border-rose-500/40 rounded-xl text-rose-300 text-xs flex items-center gap-2">
                  <span className="text-sm font-bold shrink-0">⚠️</span>
                  <span>{error}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">Username / Login ID (පරිශීලක නාමය)</label>
                  <input 
                    type="text" 
                    required 
                    value={username} 
                    onChange={e => setUsername(e.target.value)} 
                    placeholder="Enter your username" 
                    className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5">Password (මුරපදය)</label>
                  <div className="relative">
                    <input 
                      type={showPass ? "text" : "password"} 
                      required 
                      value={password} 
                      onChange={e => setPassword(e.target.value)} 
                      placeholder="Enter your password" 
                      className="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono pr-14"
                    />
                    <button 
                      type="button" 
                      onClick={() => setShowPass(!showPass)} 
                      className="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white cursor-pointer font-medium"
                    >
                      {showPass ? "Hide" : "Show"}
                    </button>
                  </div>
                </div>

                {/* Submit Sign In Button */}
                <button 
                  type="submit" 
                  className={`w-full py-3 ${activeTheme.primaryBtn} font-bold rounded-xl text-sm transition-all shadow-lg active:scale-[0.99] cursor-pointer`}
                >
                  Sign In to Workspace ➔
                </button>

                {/* THEME & ANIMATED EFFECT CONTROLS (Directly under Login Button - Available to All Users) */}
                <div className="pt-4 mt-2 border-t border-slate-700/80 space-y-3">
                  <div className="flex items-center justify-between text-xs text-slate-300">
                    <span className="font-semibold flex items-center gap-1.5">
                      <span>🎨</span> Workspace Appearance & Effects
                    </span>
                    <span className="text-[10px] text-slate-400 font-mono">All Users</span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    {/* Theme Selector */}
                    <div>
                      <label className="block text-[11px] font-medium text-slate-400 mb-1">
                        Theme (වර්ණ තේමාව)
                      </label>
                      <select
                        value={themeId || 'emerald'}
                        onChange={e => onThemeChange && onThemeChange(e.target.value)}
                        className="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer"
                      >
                        {(themes || THEMES).map(t => (
                          <option key={t.id} value={t.id} className="bg-slate-900 text-white">
                            {t.shortName ? `${t.shortName} · ${t.nameSi || ''}` : t.name}
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* Background Effect Selector */}
                    <div>
                      <label className="block text-[11px] font-medium text-slate-400 mb-1">
                        Background Effect (පසුබිම)
                      </label>
                      <select
                        value={bgEffect || 'aurora-mesh'}
                        onChange={e => onBgEffectChange && onBgEffectChange(e.target.value)}
                        className="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer"
                      >
                        {(bgEffects || BG_EFFECTS).map(b => (
                          <option key={b.id} value={b.id} className="bg-slate-900 text-white">
                            {b.shortName ? `${b.shortName} · ${b.nameSi || ''}` : b.name}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>
                </div>
              </form>
            </div>

            <div className="flex items-center justify-between text-[11px] text-slate-400 px-2 font-mono">
              <span>🔒 Multi-Tenant RBAC</span>
              <span>Central & Site Logistics</span>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
