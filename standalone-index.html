    // --- DISPATCH VIEW ---
    function DispatchView({ items, sites, teams, issues, onUpdateIssues, currentUser, getSiteStock, addAudit }) {
      const isCentral = currentUser?.role === 'Central Warehouse Admin';
      const defaultSite = (!isCentral && currentUser?.siteId && currentUser.siteId !== 'all') 
        ? currentUser.siteId 
        : (sites.find(s => !s.isMainWarehouse)?.id || sites[0]?.id);
      const [siteId, setSiteId] = useState(defaultSite);
      const [teamId, setTeamId] = useState(teams[0]?.id || '');
      const [selectedItemId, setSelectedItemId] = useState(items[0]?.id || '');
      const [qty, setQty] = useState('');

      // Smart Auto-Incrementing Work Order Generator (WO-408 -> WO-409 -> WO-410 ...)
      const getNextWorkOrderRef = (issueList = []) => {
        let maxNum = 411; // base seed
        (issueList || []).forEach(iss => {
          if (iss.workOrderRef) {
            const matches = String(iss.workOrderRef).match(/\d+/g);
            if (matches) {
              matches.forEach(m => {
                const num = parseInt(m, 10);
                if (num > maxNum && num < 999999) maxNum = num;
              });
            }
          }
        });
        return `WO-${maxNum + 1}`;
      };

      const [workOrder, setWorkOrder] = useState(() => getNextWorkOrderRef(issues));

      const handleDispatch = (e) => {
        e.preventDefault();
        const dispatchQty = Number(qty);
        if (!selectedItemId || !teamId || dispatchQty <= 0) return;
        const itm = items.find(i => i.id === selectedItemId);
        const targetSiteId = (!isCentral && currentUser?.siteId && currentUser.siteId !== 'all') ? currentUser.siteId : siteId;
        const targetSite = sites.find(s => s.id === targetSiteId);
        const targetTeam = teams.find(t => t.id === teamId);
        const currentRef = workOrder.trim() || getNextWorkOrderRef(issues);

        const newIssue = {
          id: 'iss-' + Date.now(),
          issueNoteNumber: 'IN-' + Date.now().toString().slice(-4),
          issueDate: new Date().toISOString(),
          siteId: targetSiteId,
          siteName: targetSite?.name || 'Site Yard',
          teamId,
          teamName: targetTeam?.teamName || 'Field Team',
          workOrderRef: currentRef,
          items: [{ itemId: selectedItemId, quantity: dispatchQty }]
        };
        const updatedIssues = [newIssue, ...issues];
        onUpdateIssues(updatedIssues);
        addAudit('TEAM_DISPATCH', newIssue.issueNoteNumber, targetSite?.name || 'Site', `Issued ${dispatchQty} ${itm?.unit} of ${itm?.itemCode} to ${targetTeam?.teamName || 'team'} (${currentRef}).`);
        setQty('');

        // Automatically advance to the next consecutive fresh work order!
        const nextWo = getNextWorkOrderRef(updatedIssues);
        setWorkOrder(nextWo);
      };

      const currentAvailable = getSiteStock(siteId, selectedItemId).availableBalance;

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border">
            <h1 className="text-xl font-bold text-slate-900">Issue Stock to Field Teams (Daily Dispatch)</h1>
            <p className="text-xs text-slate-600">Dispatches material from site branch inventory to field crews for work orders.</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <form onSubmit={handleDispatch} className="lg:col-span-5 bg-white p-5 rounded-xl border space-y-3">
              <h3 className="font-bold text-sm text-slate-900 border-b pb-2">Issue Material to Field Crew</h3>
              <div>
                <label className="block text-xs font-semibold mb-1">Dispatching Site Yard *</label>
                {isCentral ? (
                  <select value={siteId} onChange={e => setSiteId(e.target.value)} className="w-full p-2 border rounded text-xs">
                    {sites.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                ) : (
                  <div className="p-2 border rounded text-xs bg-slate-100 font-bold text-slate-800">
                    📍 {sites.find(s => s.id === siteId)?.name || 'Assigned Yard'} (🔒 Locked Yard)
                  </div>
                )}
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1">Target Field Team *</label>
                <select value={teamId} onChange={e => setTeamId(e.target.value)} className="w-full p-2 border rounded text-xs">
                  {teams.length === 0 ? <option value="">No teams registered yet</option> : teams.map(t => <option key={t.id} value={t.id}>{t.teamName}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1">Select Item *</label>
                <select value={selectedItemId} onChange={e => setSelectedItemId(e.target.value)} className="w-full p-2 border rounded text-xs">
                  {items.map(i => <option key={i.id} value={i.id}>{i.itemCode} - {i.itemName} (Available: {getSiteStock(siteId, i.id).availableBalance})</option>)}
                </select>
              </div>

              {/* Live Yard Stock Indicator */}
              <div className="p-2.5 bg-slate-50 border rounded-lg flex items-center justify-between text-xs font-mono">
                <span className="text-slate-600 font-sans">Available in {sites.find(s => s.id === siteId)?.name || 'Yard'}:</span>
                <span className={`font-bold ${currentAvailable > 0 ? 'text-emerald-700' : 'text-amber-600'}`}>
                  {currentAvailable} {items.find(i => i.id === selectedItemId)?.unit || 'Units'}
                </span>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-semibold mb-1">Quantity *</label>
                  <input type="number" required min="1" value={qty} onChange={e => setQty(e.target.value)} placeholder="Units" className="w-full p-2 border rounded text-xs font-mono font-bold" />
                </div>
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-semibold">Work Order Ref *</label>
                    <div className="flex items-center gap-1">
                      <button 
                        type="button" 
                        onClick={() => setWorkOrder(getNextWorkOrderRef(issues))} 
                        className="px-1.5 py-0.2 text-[10px] font-bold rounded bg-blue-50 text-blue-700 border border-blue-200 hover:bg-blue-100 cursor-pointer"
                        title="Generate next sequential work order"
                      >
                        🔄 Next
                      </button>
                      <button 
                        type="button" 
                        onClick={() => setWorkOrder('WO-' + Math.floor(100 + Math.random() * 900))} 
                        className="px-1.5 py-0.2 text-[10px] font-bold rounded bg-slate-100 text-slate-700 border border-slate-300 hover:bg-slate-200 cursor-pointer"
                        title="Generate random work order"
                      >
                        🎲
                      </button>
                    </div>
                  </div>
                  <input value={workOrder} onChange={e => setWorkOrder(e.target.value)} required placeholder="e.g. WO-412" className="w-full p-2 border rounded text-xs font-mono font-bold" />
                  <span className="text-[9px] text-slate-400 block mt-0.5">Auto-increments on each dispatch</span>
                </div>
              </div>
              <button type="submit" className="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded text-xs font-semibold cursor-pointer shadow-xs active:scale-[0.99] transition-all">
                Confirm Dispatch Note
              </button>
            </form>

            <div className="lg:col-span-7 bg-white rounded-xl border overflow-hidden">
              <div className="p-3 border-b font-bold text-xs text-slate-800">Recent Team Dispatch Notes</div>
              <div className="overflow-x-auto max-h-80">
                <table className="w-full text-xs text-left">
                  <thead className="bg-slate-50 border-b">
                    <tr>
                      <th className="p-2">Note No</th>
                      <th className="p-2">Team</th>
                      <th className="p-2">Items</th>
                      <th className="p-2">Work Order</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y">
                    {issues.length === 0 ? (
                      <tr><td colSpan="4" className="py-6 text-center text-slate-400">No dispatches logged.</td></tr>
                    ) : (
                      issues.map(iss => {
                        const t = teams.find(x => x.id === iss.teamId);
                        return (
                          <tr key={iss.id}>
                            <td className="p-2 font-mono font-bold">{iss.issueNoteNumber}</td>
                            <td className="p-2 font-semibold">{t?.teamName || 'Team'}</td>
                            <td className="p-2">{(iss.items || []).map(i => `${items.find(x => x.id === i.itemId)?.itemCode || 'Item'} (${i.quantity})`).join(', ')}</td>
                            <td className="p-2 font-mono text-slate-500">{iss.workOrderRef}</td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- RETURNS VIEW (Site to Main Warehouse Return & Field Team Returns) ---
    function ReturnsView({ items, sites, teams, returns, onUpdateReturns, siteReturns = [], onUpdateSiteReturns, currentUser, addAudit, getSiteStock, getMainStock, isCentralAdmin, onOpenPrintVoucher, siteAdjustments = [], onUpdateAdjustments, stockRequests = [], onUpdateRequests }) {
      const [activeReturnTab, setActiveReturnTab] = useState('site-to-main'); // 'site-to-main' | 'team-to-site'

      // Site to Main Warehouse Return Form State
      const defaultSite = (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') 
        ? currentUser.siteId 
        : (sites.find(s => !s.isMainWarehouse)?.id || sites[0]?.id);
      const [siteId, setSiteId] = useState(defaultSite);
      const [selectedItemId, setSelectedItemId] = useState(items[0]?.id || '');
      const [qty, setQty] = useState('');
      const [condition, setCondition] = useState('Good');
      const [reason, setReason] = useState('Excess / Surplus stock after project completion');
      const [transportRef, setTransportRef] = useState('TR-' + Math.floor(100 + Math.random() * 900));
      const [notes, setNotes] = useState('');

      // Quick Yard Stock Adjust Modal State
      const [showYardAdjustModal, setShowYardAdjustModal] = useState(false);
      const [adjustQty, setAdjustQty] = useState('10');
      const [adjustReason, setAdjustReason] = useState('Physical stock count at yard gate');

      // Field Team Return Form State
      const [teamSiteId, setTeamSiteId] = useState(defaultSite);
      const [teamId, setTeamId] = useState(teams[0]?.id || '');
      const [teamItemId, setTeamItemId] = useState(items[0]?.id || '');
      const [teamQty, setTeamQty] = useState('');
      const [teamCondition, setTeamCondition] = useState('Good');

      const branchSites = sites.filter(s => !s.isMainWarehouse);
      const activeSiteStock = selectedItemId && siteId ? getSiteStock(siteId, selectedItemId) : null;
      const currentYardBalance = activeSiteStock?.availableBalance || 0;

      // Handle Quick Stock Adjustment from Return screen
      const handleQuickYardAdjust = (e) => {
        e.preventDefault();
        const adjAmount = Number(adjustQty);
        if (isNaN(adjAmount) || adjAmount === 0 || !selectedItemId || !siteId) return;
        const itm = items.find(i => i.id === selectedItemId);
        const sourceSite = sites.find(s => s.id === siteId);
        const newAdjustment = {
          id: 'adj-' + Date.now(),
          siteId,
          siteName: sourceSite?.name || 'Site Yard',
          itemId: selectedItemId,
          itemCode: itm?.itemCode || '',
          itemName: itm?.itemName || '',
          quantity: adjAmount,
          date: new Date().toISOString(),
          reason: adjustReason.trim() || 'Physical inventory adjustment'
        };
        if (onUpdateAdjustments) {
          onUpdateAdjustments([newAdjustment, ...(siteAdjustments || [])]);
        }
        addAudit('YARD_STOCK_ADJUSTMENT', `ADJ-${Date.now().toString().slice(-4)}`, sourceSite?.name || 'Site Yard', `Adjusted yard stock by ${adjAmount > 0 ? '+' : ''}${adjAmount} ${itm?.unit} of ${itm?.itemCode}. (${adjustReason})`);
        setShowYardAdjustModal(false);
        setAdjustQty('');
      };

      // Handle Return from Site Branch back to Main Central Warehouse
      const handleSiteReturnToMain = (e) => {
        e.preventDefault();
        const returnQty = Number(qty);
        if (!selectedItemId || !siteId || returnQty <= 0) {
          alert("Please specify a valid item and return quantity.");
          return;
        }

        const itm = items.find(i => i.id === selectedItemId);
        const sourceSite = sites.find(s => s.id === siteId);
        const currentBal = getSiteStock(siteId, selectedItemId).availableBalance;

        // Strict documentation enforcement: Cannot return if no stock was documented/issued from Main Central Warehouse
        if (currentBal <= 0) {
          alert(`Cannot return: Yard stock balance is 0 for ${itm?.itemCode || 'this item'}.\n\nMain Central Warehouse වෙතින් මෙම Site එකට තොග Document වී (Issue / Transfer වී) නොමැති බැවින් Return කළ නොහැක.\n(Stock must be officially documented and transferred from Main Depot to this Site before any return can be processed).`);
          return;
        }

        if (returnQty > currentBal) {
          alert(`Cannot return: Return quantity (${returnQty}) exceeds current documented yard balance (${currentBal} ${itm?.unit || 'Units'}).\n\nSite Yard එකේ Document වී ඇති තොග ප්‍රමාණයට වඩා Return කළ නොහැක.`);
          return;
        }

        const newSiteRet = {
          id: 'sret-' + Date.now(),
          returnVoucherNumber: 'SRM-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000),
          returnDate: new Date().toISOString(),
          sourceSiteId: siteId,
          sourceSiteName: sourceSite?.name || 'Site Yard',
          itemId: selectedItemId,
          itemCode: itm?.itemCode || '',
          itemName: itm?.itemName || '',
          unit: itm?.unit || 'Units',
          quantity: returnQty,
          condition,
          reason,
          transportRef,
          notes: notes.trim(),
          returnedBy: currentUser?.fullName || 'Site Supervisor'
        };

        const updated = [newSiteRet, ...(siteReturns || [])];
        if (onUpdateSiteReturns) onUpdateSiteReturns(updated);

        addAudit(
          'SITE_RETURN_TO_MAIN', 
          newSiteRet.returnVoucherNumber, 
          sourceSite?.name || 'Site Yard', 
          `Returned ${returnQty} ${itm?.unit} of ${itm?.itemCode} back to Main Central Warehouse (${condition}). Reason: ${reason}`
        );

        alert(`✓ Return Voucher ${newSiteRet.returnVoucherNumber} recorded successfully!\n\n${returnQty} ${itm?.unit} of ${itm?.itemCode} has been returned from ${sourceSite?.name} and credited back into Main Central Warehouse available stock.`);
        setQty('');
        setNotes('');
        setTransportRef('TR-' + Math.floor(100 + Math.random() * 900));
      };

      // Handle Field Team Return back to Site Yard
      const handleTeamReturn = (e) => {
        e.preventDefault();
        if (!teamItemId || !teamId || Number(teamQty) <= 0) return;
        const itm = items.find(i => i.id === teamItemId);
        const targetSiteId = (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') ? currentUser.siteId : teamSiteId;
        const newRet = {
          id: 'ret-' + Date.now(),
          returnVoucherNumber: 'RV-' + Date.now().toString().slice(-4),
          returnDate: new Date().toISOString(),
          siteId: targetSiteId,
          teamId,
          itemId: teamItemId,
          quantity: Number(teamQty),
          condition: teamCondition
        };
        onUpdateReturns([newRet, ...returns]);
        addAudit('TEAM_RETURN', newRet.returnVoucherNumber, sites.find(s => s.id === targetSiteId)?.name || 'Site', `Returned ${teamQty} ${itm?.unit} of ${itm?.itemCode} (${teamCondition})`);
        setTeamQty('');
      };

      return (
        <div className="space-y-6">
          {/* Header & Sub-navigation */}
          <div className="bg-white p-5 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900">Material Stock Returns Hub</h1>
              <p className="text-xs text-slate-600">Return surplus or unused materials from site branches to Main Central Warehouse, or receive team field returns.</p>
            </div>
            
            {/* Tab Switcher */}
            <div className="flex p-1 bg-slate-100 rounded-xl border border-slate-200">
              <button 
                onClick={() => setActiveReturnTab('site-to-main')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer ${
                  activeReturnTab === 'site-to-main' 
                    ? 'bg-slate-900 text-white shadow-xs' 
                    : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>🏢 Site ➔ Main Warehouse Return</span>
                <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-500 text-white font-mono">{siteReturns.length}</span>
              </button>
              <button 
                onClick={() => setActiveReturnTab('team-to-site')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer ${
                  activeReturnTab === 'team-to-site' 
                    ? 'bg-slate-900 text-white shadow-xs' 
                    : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>👷 Field Team ➔ Site Yard Return</span>
                <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-blue-500 text-white font-mono">{returns.length}</span>
              </button>
            </div>
          </div>

          {/* TAB 1: SITE TO MAIN CENTRAL WAREHOUSE RETURN */}
          {activeReturnTab === 'site-to-main' && (
            <div className="space-y-6">
              <div className="p-4 bg-gradient-to-r from-emerald-50 to-blue-50 border border-emerald-200 rounded-xl text-xs text-slate-800 space-y-1">
                <div className="font-bold text-emerald-950 flex items-center gap-2">
                  <span>🔄 Site to Main Central Warehouse Material Return (ශාඛාවෙන් ප්‍රධාන ගබඩාවට භාණ්ඩ ආපසු යැවීම)</span>
                  <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-200/70 text-emerald-900">Restocks Central Depot</span>
                </div>
                <p className="text-slate-600">
                  When a site has surplus materials, completed projects, or re-allocations, return items to the Main Central Warehouse. 
                  The quantity is immediately deducted from the site yard and <strong>added back to the Main Central Warehouse stock</strong>, so it can be re-issued to other sites.
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Return Form */}
                <form onSubmit={handleSiteReturnToMain} className="lg:col-span-5 bg-white p-5 rounded-xl border border-slate-200 space-y-3.5 shadow-xs">
                  <h3 className="font-bold text-sm text-slate-900 border-b pb-2 flex items-center justify-between">
                    <span>Log Return to Main Central Warehouse</span>
                    <span className="text-[10px] font-mono text-emerald-600">Reversible Stock</span>
                  </h3>

                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Returning Site Branch *</label>
                    {isCentralAdmin ? (
                      <select 
                        value={siteId} 
                        onChange={e => setSiteId(e.target.value)} 
                        className="w-full p-2 border rounded-lg text-xs bg-white font-medium"
                      >
                        {branchSites.map(s => <option key={s.id} value={s.id}>{s.name} ({s.location})</option>)}
                      </select>
                    ) : (
                      <div className="p-2 border rounded-lg text-xs bg-slate-100 font-bold text-slate-800 flex items-center justify-between">
                        <span>📍 {sites.find(s => s.id === siteId)?.name || 'Assigned Site'}</span>
                        <span className="text-[10px] text-blue-600 font-mono">(🔒 Locked to your site)</span>
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Select Item to Return *</label>
                    <select 
                      value={selectedItemId} 
                      onChange={e => setSelectedItemId(e.target.value)} 
                      className="w-full p-2 border rounded-lg text-xs bg-white font-medium"
                    >
                      {items.map(i => {
                        const bal = getSiteStock(siteId, i.id).availableBalance;
                        return (
                          <option key={i.id} value={i.id}>
                            {i.itemCode} - {i.itemName} (Yard Stock: {bal} {i.unit})
                          </option>
                        );
                      })}
                    </select>
                  </div>

                  {/* Available Stock Indicator */}
                  <div className="p-2.5 bg-slate-50 border rounded-lg flex items-center justify-between text-xs font-mono">
                    <div className="flex flex-col">
                      <span className="text-slate-600 font-sans font-medium">Current Available at Yard:</span>
                      <span className="text-[10px] text-slate-400 font-sans">
                        {sites.find(s => s.id === siteId)?.name || 'Yard'}
                      </span>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className={`font-bold ${currentYardBalance > 0 ? 'text-emerald-700' : 'text-rose-600'}`}>
                        {currentYardBalance} {items.find(i => i.id === selectedItemId)?.unit || 'Pcs'}
                      </span>
                    </div>
                  </div>

                  {/* 1-Click Receive In-Transit Shipment from Main Depot if present */}
                  {stockRequests && stockRequests.some(r => (r.siteId === siteId || (sites.find(s=>s.id===siteId)?.name && r.siteName === sites.find(s=>s.id===siteId)?.name)) && r.status === 'Approved') && (
                    <div className="p-2.5 bg-blue-50 border border-blue-200 rounded-lg flex items-center justify-between text-xs text-blue-900">
                      <div className="flex items-center gap-1.5 font-medium">
                        <span>🚚</span>
                        <span>Dispatched shipment from Main Depot is arriving.</span>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          const reqToAccept = stockRequests.find(r => (r.siteId === siteId || (sites.find(s=>s.id===siteId)?.name && r.siteName === sites.find(s=>s.id===siteId)?.name)) && r.status === 'Approved');
                          if (reqToAccept && onUpdateRequests) {
                            const updated = stockRequests.map(r => r.id === reqToAccept.id ? { ...r, status: 'Accepted' } : r);
                            onUpdateRequests(updated);
                            addAudit('REQUEST_ACCEPTED', reqToAccept.requestNoteNumber, sites.find(s => s.id === siteId)?.name || 'Site', `Confirmed gate arrival into site stock.`);
                          }
                        }}
                        className="px-2 py-1 bg-blue-700 hover:bg-blue-800 text-white rounded text-[10px] font-bold cursor-pointer"
                      >
                        ✓ Receive into Yard
                      </button>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-xs font-semibold mb-1 text-slate-700">Return Quantity *</label>
                      <input 
                        type="number" 
                        required 
                        min="1" 
                        max={currentYardBalance > 0 ? currentYardBalance : 0}
                        disabled={currentYardBalance <= 0}
                        value={qty} 
                        onChange={e => setQty(e.target.value)} 
                        placeholder={currentYardBalance > 0 ? `Max ${currentYardBalance}` : "0 (Yard stock 0)"} 
                        className={`w-full p-2 border rounded-lg text-xs font-mono font-bold focus:ring-1 focus:ring-slate-900 ${
                          currentYardBalance <= 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : ''
                        }`} 
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1 text-slate-700">Condition *</label>
                      <select 
                        value={condition} 
                        onChange={e => setCondition(e.target.value)} 
                        className="w-full p-2 border rounded-lg text-xs bg-white font-medium"
                      >
                        <option value="Good">Good / Restock into Main Depot</option>
                        <option value="Damaged">Damaged / Defect / Scrap</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Reason for Return *</label>
                    <select 
                      value={reason} 
                      onChange={e => setReason(e.target.value)} 
                      className="w-full p-2 border rounded-lg text-xs bg-white"
                    >
                      <option value="Excess / Surplus stock after project completion">Excess / Surplus stock after project completion</option>
                      <option value="Inter-site transfer via Main Depot">Inter-site transfer via Main Depot</option>
                      <option value="Unused requisition materials">Unused requisition materials</option>
                      <option value="Defective / QC reject">Defective / QC reject</option>
                      <option value="Project cancelled / scope changed">Project cancelled / scope changed</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Transport / Gate Pass Note Ref</label>
                    <input 
                      value={transportRef} 
                      onChange={e => setTransportRef(e.target.value)} 
                      placeholder="e.g. TR-2026-081" 
                      className="w-full p-2 border rounded-lg text-xs font-mono" 
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Remarks / Inspection Notes</label>
                    <textarea 
                      rows="2" 
                      value={notes} 
                      onChange={e => setNotes(e.target.value)} 
                      placeholder="e.g. Verified clean condition, sealed in protective drum." 
                      className="w-full p-2 border rounded-lg text-xs" 
                    />
                  </div>

                  <button 
                    type="submit" 
                    disabled={currentYardBalance <= 0 || !qty || Number(qty) <= 0 || Number(qty) > currentYardBalance}
                    className={`w-full py-2.5 rounded-lg text-xs font-bold transition-all shadow-xs ${
                      currentYardBalance <= 0 || !qty || Number(qty) <= 0 || Number(qty) > currentYardBalance
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none'
                        : 'bg-emerald-700 hover:bg-emerald-800 text-white cursor-pointer shadow-emerald-900/20 active:scale-[0.99]'
                    }`}
                  >
                    Confirm Return to Main Warehouse ➔
                  </button>
                  {currentYardBalance <= 0 && (
                    <div className="text-center text-xs font-semibold text-rose-600 mt-2">
                      Cannot return: Yard has 0 balance for this item.
                    </div>
                  )}
                  {currentYardBalance > 0 && Number(qty) > currentYardBalance && (
                    <div className="text-center text-xs font-semibold text-rose-600 mt-2">
                      Cannot return: Return quantity ({qty}) exceeds available yard balance ({currentYardBalance}).
                    </div>
                  )}
                </form>

                {/* History Table */}
                <div className="lg:col-span-7 bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col shadow-xs">
                  <div className="p-3.5 border-b flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-xs text-slate-900">Returns to Main Central Warehouse History</h3>
                      <p className="text-[11px] text-slate-500">Material credited back to Central Depot available stock</p>
                    </div>
                    <span className="text-xs font-mono font-semibold text-slate-600 bg-slate-100 px-2.5 py-1 rounded">
                      {siteReturns.length} records
                    </span>
                  </div>

                  <div className="overflow-x-auto flex-1 max-h-[480px]">
                    <table className="w-full text-xs text-left">
                      <thead className="bg-slate-50 border-b sticky top-0 text-slate-700">
                        <tr>
                          <th className="py-2.5 px-3">Return Note</th>
                          <th className="py-2.5 px-3">From Site</th>
                          <th className="py-2.5 px-3">Material</th>
                          <th className="py-2.5 px-3 text-right">Quantity</th>
                          <th className="py-2.5 px-3">Condition</th>
                          <th className="py-2.5 px-3">Reason</th>
                          <th className="py-2.5 px-3 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {siteReturns.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="py-12 text-center text-slate-400">
                              No site returns to Main Central Warehouse recorded yet.
                            </td>
                          </tr>
                        ) : (
                          siteReturns.map(ret => {
                            const itm = items.find(x => x.id === ret.itemId);
                            const srcSite = sites.find(x => x.id === ret.sourceSiteId);
                            return (
                              <tr key={ret.id} className="hover:bg-slate-50">
                                <td className="py-2.5 px-3 font-mono font-bold text-slate-900">{ret.returnVoucherNumber}</td>
                                <td className="py-2.5 px-3 font-semibold text-slate-800">{srcSite?.name || ret.sourceSiteName || 'Site'}</td>
                                <td className="py-2.5 px-3">
                                  <div className="font-mono font-bold text-slate-900">{itm?.itemCode || ret.itemCode}</div>
                                  <div className="text-[11px] text-slate-500 truncate max-w-[130px]">{itm?.itemName || ret.itemName}</div>
                                </td>
                                <td className="py-2.5 px-3 text-right font-mono font-bold text-emerald-700">
                                  +{ret.quantity} {ret.unit || itm?.unit}
                                </td>
                                <td className="py-2.5 px-3">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                    ret.condition === 'Good' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'
                                  }`}>
                                    {ret.condition}
                                  </span>
                                </td>
                                <td className="py-2.5 px-3 text-slate-600 text-[11px] max-w-[140px] truncate" title={ret.reason}>
                                  {ret.reason}
                                </td>
                                <td className="py-2.5 px-3 text-right">
                                  <button
                                    type="button"
                                    onClick={() => onOpenPrintVoucher && onOpenPrintVoucher(ret)}
                                    className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 rounded text-[11px] font-bold inline-flex items-center gap-1 cursor-pointer"
                                    title="Print Material Return Voucher (Comtec PDF format)"
                                  >
                                    <span>🖨️</span>
                                    <span>Print</span>
                                  </button>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: FIELD TEAM RETURNS TO SITE YARD */}
          {activeReturnTab === 'team-to-site' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <form onSubmit={handleTeamReturn} className="lg:col-span-5 bg-white p-5 rounded-xl border border-slate-200 space-y-3 shadow-xs">
                <h3 className="font-bold text-sm text-slate-900 border-b pb-2">Log Field Team Return Voucher</h3>
                <div>
                  <label className="block text-xs font-semibold mb-1 text-slate-700">Receiving Site Yard *</label>
                  {isCentralAdmin ? (
                    <select value={teamSiteId} onChange={e => setTeamSiteId(e.target.value)} className="w-full p-2 border rounded-lg text-xs bg-white">
                      {sites.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                  ) : (
                    <div className="p-2 border rounded-lg text-xs bg-slate-100 font-bold text-slate-800">
                      📍 {sites.find(s => s.id === teamSiteId)?.name || 'Assigned Yard'} (🔒 Locked Yard)
                    </div>
                  )}
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1 text-slate-700">Returning Field Team *</label>
                  <select value={teamId} onChange={e => setTeamId(e.target.value)} className="w-full p-2 border rounded-lg text-xs bg-white">
                    {teams.length === 0 ? <option value="">No teams</option> : teams.map(t => <option key={t.id} value={t.id}>{t.teamName}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold mb-1 text-slate-700">Item Returned *</label>
                  <select value={teamItemId} onChange={e => setTeamItemId(e.target.value)} className="w-full p-2 border rounded-lg text-xs bg-white">
                    {items.map(i => <option key={i.id} value={i.id}>{i.itemCode} - {i.itemName}</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Quantity Returned *</label>
                    <input type="number" required min="1" value={teamQty} onChange={e => setTeamQty(e.target.value)} className="w-full p-2 border rounded-lg text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold mb-1 text-slate-700">Condition</label>
                    <select value={teamCondition} onChange={e => setTeamCondition(e.target.value)} className="w-full p-2 border rounded-lg text-xs bg-white">
                      <option value="Good">Good / Restock</option>
                      <option value="Damaged">Damaged / Scrap</option>
                    </select>
                  </div>
                </div>
                <button type="submit" className="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold transition-colors shadow-xs cursor-pointer">
                  Submit Team Return Voucher
                </button>
              </form>

              <div className="lg:col-span-7 bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
                <div className="p-3.5 border-b font-bold text-xs text-slate-800 flex justify-between items-center">
                  <span>Field Team Return Vouchers History</span>
                  <span className="text-slate-500 font-mono font-normal">{returns.length} records</span>
                </div>
                <div className="overflow-x-auto max-h-80">
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-50 border-b text-slate-700">
                      <tr>
                        <th className="p-2.5">Voucher No</th>
                        <th className="p-2.5">Team</th>
                        <th className="p-2.5">Item</th>
                        <th className="p-2.5 text-right">Qty</th>
                        <th className="p-2.5">Condition</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {returns.length === 0 ? (
                        <tr><td colSpan="5" className="py-8 text-center text-slate-400">No team returns recorded.</td></tr>
                      ) : (
                        returns.map(ret => {
                          const t = teams.find(x => x.id === ret.teamId);
                          const itm = items.find(x => x.id === ret.itemId);
                          return (
                            <tr key={ret.id} className="hover:bg-slate-50">
                              <td className="p-2.5 font-mono font-bold">{ret.returnVoucherNumber}</td>
                              <td className="p-2.5 font-semibold text-slate-800">{t?.teamName || 'Team'}</td>
                              <td className="p-2.5">{itm?.itemCode || 'Item'}</td>

    function TeamsView({ teams, sites, onUpdateTeams, isCentralAdmin, addAudit, teamIssues, teamReturns, items, currentUser }) {
      const [teamName, setTeamName] = useState('');
      const [leader, setLeader] = useState('');
      const defaultSite = (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') 
        ? currentUser.siteId 
        : (sites.find(s => !s.isMainWarehouse)?.id || sites[0]?.id);
      const [siteId, setSiteId] = useState(defaultSite);

      const handleAddTeam = (e) => {
        e.preventDefault();
        const targetSiteId = (!isCentralAdmin && currentUser?.siteId && currentUser.siteId !== 'all') ? currentUser.siteId : siteId;
        const newTeam = {
          id: 'team-' + Date.now(),
          teamName: teamName.trim(),
          teamLeaderName: leader.trim(),
          assignedSiteId: targetSiteId
        };
        onUpdateTeams([...teams, newTeam]);
        addAudit('TEAM_CREATED', newTeam.teamName, sites.find(s => s.id === targetSiteId)?.name || 'Site', `Registered field team ${newTeam.teamName}`);
        setTeamName(''); setLeader('');
      };

      const getTeamBalance = (teamId, itemId) => {
        const issued = teamIssues.filter(i => i.teamId === teamId).reduce((s, i) => {
          const row = (i.items || []).find(x => x.itemId === itemId);
          return s + (row ? Number(row.quantity) : 0);
        }, 0);
        const returned = teamReturns.filter(r => r.teamId === teamId && r.itemId === itemId).reduce((s, r) => s + Number(r.quantity), 0);
        return Math.max(0, issued - returned);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border">
            <h1 className="text-xl font-bold text-slate-900">Field Work Teams & In-Hand Stock</h1>

                <label className="block text-xs font-semibold mb-1">Team Name *</label>
                <input required value={teamName} onChange={e => setTeamName(e.target.value)} placeholder="e.g. Stringing Crew Alpha" className="w-full p-2 border rounded text-xs" />
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1">Team Leader / Foreman *</label>
                <input required value={leader} onChange={e => setLeader(e.target.value)} placeholder="e.g. Sunil Shantha" className="w-full p-2 border rounded text-xs" />
              </div>
              <div>
                <label className="block text-xs font-semibold mb-1">Assigned Site *</label>
                {isCentralAdmin ? (
                  <select value={siteId} onChange={e => setSiteId(e.target.value)} className="w-full p-2 border rounded text-xs">
                    {sites.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}

                ) : (
                  <div className="p-2 border rounded text-xs bg-slate-100 font-bold text-slate-800">
                    📍 {sites.find(s => s.id === siteId)?.name || 'Assigned Yard'} (🔒 Locked Yard)
                  </div>
                )}
              </div>
              <button type="submit" className="w-full py-2 bg-slate-900 text-white rounded text-xs font-semibold">
                Register Team
              </button>
            </form>

            <div className="lg:col-span-8 space-y-3">
              {teams.length === 0 ? (
                <div className="bg-white p-8 rounded-xl border text-center text-slate-400 text-xs">No field teams registered yet.</div>
              ) : (
                teams.map(t => {
                  const s = sites.find(x => x.id === t.assignedSiteId);
                  const heldItems = items.filter(i => getTeamBalance(t.id, i.id) > 0);
                  return (
                    <div key={t.id} className="bg-white p-4 rounded-xl border">
                      <div className="flex justify-between items-center border-b pb-2 mb-2">

          password: password.trim(),

    // =========================================================================
    // --- INTERACTIVE SIGNATURE DRAWING PAD (Pure HTML5 Canvas, Mouse & Touch) ---
    // =========================================================================
    function SignaturePadCanvas({ onSaveSignature, onCancel }) {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasDrawn, setHasDrawn] = useState(false);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      };

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        setHasDrawn(true);
        if (e.cancelable && e.touches) e.preventDefault();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const handleClear = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setHasDrawn(false);
      };

      const handleDone = () => {
        const canvas = canvasRef.current;
        if (!canvas || !hasDrawn) return;
        const dataUrl = canvas.toDataURL('image/png');
        onSaveSignature(dataUrl);
      };

      return (
        <div className="space-y-2">
          <div className="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 p-2 text-center">
            <canvas
              ref={canvasRef}
              width={380}
              height={130}
              className="bg-white rounded-lg shadow-inner cursor-crosshair mx-auto touch-none border border-slate-200"
              onMouseDown={startDrawing}
              onMouseMove={draw}
              onMouseUp={stopDrawing}
              onMouseLeave={stopDrawing}
              onTouchStart={startDrawing}
              onTouchMove={draw}
              onTouchEnd={stopDrawing}
            />
            <div className="text-[10px] text-slate-400 mt-1 font-sans">
              Draw signature using mouse, stylus, or touchscreen inside box above
            </div>
          </div>
          <div className="flex items-center justify-between gap-2 pt-1">
            <button
              type="button"
              onClick={handleClear}
              className="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg cursor-pointer"
            >
              Clear Pad
            </button>
            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={onCancel}
                className="px-3 py-1 border text-xs text-slate-600 rounded-lg cursor-pointer"
              >
                Cancel
              </button>
              <button
                type="button"
                disabled={!hasDrawn}
                onClick={handleDone}
                className={`px-4 py-1 text-xs font-bold rounded-lg cursor-pointer ${
                  hasDrawn ? 'bg-emerald-700 hover:bg-emerald-800 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                }`}
              >
                Use Drawn Signature
              </button>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // --- PRINTABLE LETTERHEAD VOUCHER MODAL (Comtec Systems Exact PDF Format) ---
    // =========================================================================
    function PrintableLetterheadModal({ 
      voucherData, 
      templates, 
      activeTemplateId, 
      onSelectTemplate, 
      digitalSignatures = [], 
      onClose, 
      onUpdateVoucherData, 
      sites, 
      items 
    }) {
      const [editMode, setEditMode] = useState(false);
      const [paperSize, setPaperSize] = useState('a4'); // 'a4' | 'a4-landscape' | 'letter'
      const [rowCount, setRowCount] = useState(22); // 22 is exact match to Comtec PDF
      const [localData, setLocalData] = useState(() => JSON.parse(JSON.stringify(voucherData)));

      const activeTemplate = templates.find(t => t.id === activeTemplateId) || templates[0] || {};

      // Robust Print Handlers (solves user request: "print dena thana print /pdf button eka function wenne na")
      const handlePrint = () => {
        try {
          window.focus();
          window.print();
        } catch (e) {
          console.warn("Direct window.print() failed, falling back to clean popup window", e);
          handleOpenCleanPrintWindow();
        }
      };

      const handleOpenCleanPrintWindow = () => {
        const printableEl = document.getElementById('letterhead-printable-area');
        if (!printableEl) return;
        const printWindow = window.open('', '_blank', 'width=950,height=1000');
        if (printWindow) {
          const tailwindScript = '<' + 'script src="https://cdn.tailwindcss.com">' + '<' + '/script>';
          const autoPrintScript = '<' + 'script>window.onload = function() { setTimeout(function() { window.focus(); window.print(); }, 400); };' + '<' + '/script>';
          printWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <title>${localData.docNumber || 'Voucher'}_Letterhead</title>
              <meta charset="utf-8">
              ${tailwindScript}
              <style>
                @page { size: ${paperSize === 'a4-landscape' ? 'A4 landscape' : 'A4 portrait'}; margin: 8mm; }
                body { margin: 0; padding: 12px; background: #fff; color: #000; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                .comtec-table { border-collapse: collapse; width: 100%; }
                .comtec-table th, .comtec-table td { border: 1px solid #000 !important; }
              </style>
            </head>
            <body>
              <div style="max-width: ${paperSize === 'a4-landscape' ? '1080px' : '820px'}; margin: 0 auto;">
                ${printableEl.innerHTML}
              </div>
              ${autoPrintScript}
            </body>
            </html>
          `);
          printWindow.document.close();
        } else {
          handleDownloadStandaloneHtml();
        }
      };

      const handleDownloadStandaloneHtml = () => {
        const printableEl = document.getElementById('letterhead-printable-area');
        if (!printableEl) return;
        const tailwindScript = '<' + 'script src="https://cdn.tailwindcss.com">' + '<' + '/script>';
        const htmlDoc = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>${localData.docNumber || 'Voucher'}_Letterhead_ComtecSystems</title>
  ${tailwindScript}
  <style>
    @page { size: ${paperSize === 'a4-landscape' ? 'A4 landscape' : 'A4 portrait'}; margin: 8mm; }
    body { margin: 0; padding: 16px; background: #fff; color: #000; font-family: ui-sans-serif, system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .comtec-table { border-collapse: collapse; width: 100%; }
    .comtec-table th, .comtec-table td { border: 1px solid #000 !important; }
  </style>
</head>
<body onload="setTimeout(function(){ window.print(); }, 400);">
  <div style="max-width: ${paperSize === 'a4-landscape' ? '1080px' : '820px'}; margin: 0 auto;">
    ${printableEl.innerHTML}
  </div>
</body>
</html>`;
        const blob = new Blob([htmlDoc], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${localData.docNumber || 'Voucher'}_Letterhead.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      };

      const handleFieldChange = (field, value) => {
        const next = { ...localData, [field]: value };
        setLocalData(next);
        if (onUpdateVoucherData) onUpdateVoucherData(next);
      };

      const handleItemChange = (idx, field, value) => {
        const nextItems = [...(localData.items || [])];
        if (!nextItems[idx]) {
          nextItems[idx] = { itemNo: idx + 1, itemCode: '', description: '', unit: 'Nos', inHand: '-', qty: '', remarks: '' };
        }
        nextItems[idx] = { ...nextItems[idx], [field]: value };
        const next = { ...localData, items: nextItems };
        setLocalData(next);
        if (onUpdateVoucherData) onUpdateVoucherData(next);
      };

      const handleAddRow = () => {
        const nextItems = [...(localData.items || [])];
        nextItems.push({
          itemNo: nextItems.length + 1,
          itemCode: '',
          description: '',
          unit: 'Nos',
          inHand: '-',
          qty: '',
          remarks: ''
        });
        const next = { ...localData, items: nextItems };
        setLocalData(next);
        if (onUpdateVoucherData) onUpdateVoucherData(next);
      };

      const handleRemoveRow = (idx) => {
        const nextItems = (localData.items || []).filter((_, i) => i !== idx).map((it, i) => ({ ...it, itemNo: i + 1 }));
        const next = { ...localData, items: nextItems };
        setLocalData(next);
        if (onUpdateVoucherData) onUpdateVoucherData(next);
      };

      // Match digital signatures for Prepared, Reviewed, and Approved
      const prepSig = digitalSignatures.find(s => s.id === localData.preparedSigId) || 
        digitalSignatures.find(s => s.name && localData.preparedBy && s.name.toLowerCase() === localData.preparedBy.toLowerCase()) || 
        (localData.preparedBy && localData.preparedBy.toLowerCase().includes('dissanayake') ? digitalSignatures.find(s => s.id === 'sig-dissanayake') : null);

      const apprSig = digitalSignatures.find(s => s.id === localData.approvedSigId) || 
        digitalSignatures.find(s => s.name && localData.approvedBy && s.name.toLowerCase() === localData.approvedBy.toLowerCase()) || 
        digitalSignatures.find(s => s.id === 'sig-arthur');

      const revSig = digitalSignatures.find(s => s.id === localData.reviewedSigId) || 
        digitalSignatures.find(s => s.name && localData.reviewedBy && s.name.toLowerCase() === localData.reviewedBy.toLowerCase()) || 
        digitalSignatures.find(s => s.id === 'sig-dissanayake');

      // Ensure table always displays exactly rowCount rows (with empty rows padded if necessary)
      const filledItems = localData.items || [];
      const totalDisplayRows = Math.max(rowCount, filledItems.length);
      const displayRows = [];
      for (let i = 0; i < totalDisplayRows; i++) {
        if (i < filledItems.length) {
          displayRows.push(filledItems[i]);
        } else {
          displayRows.push({
            itemNo: i + 1,
            itemCode: '',
            description: '',
            unit: '',
            inHand: '',
            qty: '',
            remarks: '',
            isEmpty: true
          });
        }
      }

      // Quantity Header Label depending on voucher mode
      let qtyHeaderLabel = 'REQUEST QTY';
      let dateHeaderLabel = 'Request Date';
      let docDefaultTitle = 'Material Request for';
      if (localData.mode === 'supply') {
        qtyHeaderLabel = 'SUPPLIED QTY';
        dateHeaderLabel = 'Supply Date';
        docDefaultTitle = 'Material Supply / Dispatch Note for';
      } else if (localData.mode === 'received') {
        qtyHeaderLabel = 'RECEIVED QTY';
        dateHeaderLabel = 'Received Date';
        docDefaultTitle = 'Material Goods Received (GRN) for';
      } else if (localData.mode === 'return') {
        qtyHeaderLabel = 'RETURN QTY';
        dateHeaderLabel = 'Return Date';
        docDefaultTitle = 'Material Return to Main Branch for';
      }

      return (
        <div className="fixed inset-0 bg-slate-900/80 z-50 flex flex-col items-center justify-start overflow-y-auto p-2 sm:p-4 backdrop-blur-xs print-modal-backdrop">
          {/* TOP FLOATING CONTROLS TOOLBAR (HIDDEN WHEN PRINTING) */}
          <div className="no-print w-full max-w-4xl bg-slate-900 text-white rounded-xl shadow-2xl p-3 mb-3 flex flex-wrap items-center justify-between gap-3 border border-slate-700 sticky top-2 z-50">

                <span>🖨️</span>
                <span>Letterhead Print Preview</span>
              </span>
              <span className="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-800 text-slate-300 border border-slate-700">
                {localData.docNumber || 'DOC-001'}
              </span>
            </div>

            <div className="flex items-center gap-2 flex-wrap">
              {/* Template Selector */}
              <div className="flex items-center gap-1.5 text-xs">
                <span className="text-slate-400 text-[11px]">Template:</span>
                <select 
                  value={activeTemplateId} 
                  onChange={e => onSelectTemplate(e.target.value)}

                >
                  {templates.map(t => (
                    <option key={t.id} value={t.id}>{t.templateName || t.companyName}</option>
                  ))}
                </select>
              </div>

              {/* Paper Size Selector */}
              <div className="flex items-center gap-1 text-xs">
                <span className="text-slate-400 text-[11px]">Size:</span>
                <select 
                  value={paperSize} 
                  onChange={e => setPaperSize(e.target.value)}
                  className="bg-slate-800 text-white text-xs px-2 py-1.5 rounded border border-slate-700 focus:outline-none cursor-pointer"
                >
                  <option value="a4">A4 Portrait</option>
                  <option value="a4-landscape">A4 Landscape</option>
                  <option value="letter">US Letter</option>
                </select>
              </div>

              {/* Row Count Selector */}
              <div className="flex items-center gap-1 text-xs">
                <span className="text-slate-400 text-[11px]">Grid:</span>
                <select 
                  value={rowCount} 
                  onChange={e => setRowCount(Number(e.target.value))}
                  className="bg-slate-800 text-white text-xs px-2 py-1.5 rounded border border-slate-700 focus:outline-none cursor-pointer"
                >
                  <option value={22}>22 Rows (Standard Comtec)</option>
                  <option value={18}>18 Rows (Spacious)</option>
                  <option value={26}>26 Rows (Compact)</option>
                </select>
              </div>

              {/* Edit Data Mode Button */}
              <button 
                type="button" 
                onClick={() => setEditMode(!editMode)}
                className={`px-3 py-1.5 rounded text-xs font-bold transition-colors cursor-pointer flex items-center gap-1 ${
                  editMode ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'
                }`}
              >
                <span>{editMode ? '✓ Done Editing' : '✏️ Edit Data & Signatures'}</span>
              </button>

              {/* Direct Print Button */}
              <button 
                type="button" 
                onClick={handlePrint}
                className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-bold transition-all shadow-md active:scale-95 cursor-pointer flex items-center gap-1.5"
                title="Print voucher or save as PDF"
              >
                <span>🖨️</span>
                <span>Print / Save PDF</span>
              </button>

              {/* Clean Popup Window Fallback */}
              <button

                onClick={handleOpenCleanPrintWindow}

                title="Open clean printable document in dedicated tab"
              >
                <span>📄</span>
                <span>Print Tab</span>
              </button>

              {/* Download Standalone File Fallback */}
              <button 
                type="button" 
                onClick={handleDownloadStandaloneHtml}
                className="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs font-semibold border border-slate-700 cursor-pointer hidden md:flex items-center gap-1"
                title="Download formatted HTML that auto-prints when opened"
              >
                <span>📥</span>
                <span>Download</span>
              </button>

              {/* Close Button */}
              <button 
                type="button" 
                onClick={onClose}
                className="px-2.5 py-1.5 bg-slate-800 hover:bg-rose-900 text-slate-300 hover:text-white rounded text-xs font-bold transition-colors cursor-pointer"
                title="Close Preview"
              >
                ✕
              </button>
            </div>
          </div>

          {/* EDIT MODE HELP HINT (NON-PRINT) */}
          {editMode && (
            <div className="no-print w-full max-w-4xl bg-amber-500/15 border border-amber-500/40 text-amber-200 text-xs px-4 py-2.5 rounded-lg mb-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
              <div>
                <span>✏️ <strong>Live Sheet & Signature Editing:</strong> You can edit any date, document number, item details, remarks, and select digital signatures from the library below.</span>
              </div>
              <button onClick={handleAddRow} className="px-2.5 py-1 bg-amber-500 text-slate-950 font-bold rounded text-[11px] cursor-pointer shrink-0">
                + Add Item Row
              </button>
            </div>
          )}

          {/* PRINTABLE VOUCHER SHEET CONTAINER (Targeted by window.print()) */}
          <div 
            id="letterhead-printable-area" 
            className={`printable-voucher-sheet print-modal-box bg-white text-black font-sans leading-tight shadow-2xl border border-slate-300 p-6 sm:p-8 mx-auto ${
              paperSize === 'a4-landscape' ? 'w-[1100px] max-w-[1100px]' : 'w-[820px] max-w-[820px]'
            }`}
            style={{
              minHeight: paperSize === 'a4-landscape' ? '780px' : '1080px',
              color: '#000'
            }}
          >
            {/* 1. LETTERHEAD BANNER (Exact Match to Comtec Systems attached PDF) */}
            <div className="text-center pb-2">
              <div className="flex items-center justify-center gap-3 mb-1">
                {/* Logo Graphic Placeholder (Oval Monogram) */}
                <div className="w-10 h-7 rounded-full bg-black text-white flex items-center justify-center text-[10px] font-black tracking-widest uppercase">
                  {activeTemplate.logoText || 'COM'}
                </div>
                <h1 className="text-xl sm:text-2xl font-black font-serif tracking-tight text-black uppercase">
                  {activeTemplate.companyName || 'COMTEC SYSTEMS (PVT) LTD.'}
                </h1>
              </div>

              {/* Sub-header / Business Description */}
              <p className="text-[9px] sm:text-[9.5px] leading-tight text-slate-900 max-w-2xl mx-auto font-sans font-medium">
                {activeTemplate.subtitle || 'Civil Contractors, Telecommunication Engineers and Transport Services, Building Maintenance, and Earth movers, Road Contractors, J.C.B.Backhoe Loader, Boom Truck, Drum Truck, Lories, Excavators, Forklift for Hire. Building Material suppliers.'}
              </p>

              {/* Left & Right Contact Columns */}
              <div className="flex justify-between items-start text-[9.5px] font-sans font-medium text-slate-900 mt-2 px-2">
                <div className="text-left space-y-0.5">
                  <div>Tel: <span className="font-mono">{activeTemplate.tel || '+94 11 2549590'}</span></div>
                  <div>Fax: <span className="font-mono">{activeTemplate.fax || '+94 11 2549591'}</span></div>
                  <div>E-mail: <span className="font-mono underline">{activeTemplate.email || 'comtecsystems@sltnet.lk'}</span></div>
                </div>
                <div className="text-right space-y-0.5">
                  <div>{activeTemplate.address ? activeTemplate.address.split(',')[0] : 'No: 36, Udumulla,'}</div>
                  <div>{activeTemplate.address ? (activeTemplate.address.split(',')[1] || '') : 'Malgama Road,'}</div>
                  <div>{activeTemplate.address ? (activeTemplate.address.split(',').slice(2).join(',') || 'Himbutana, Mulleriyawa.') : 'Himbutana, Mulleriyawa.'}</div>
                </div>
              </div>
            </div>

            {/* Solid Horizontal Header Divider */}
            <div className="border-t-2 border-black my-1.5"></div>

            {/* 2. THREE-BOX METADATA BAR (Exact Match to Comtec PDF) */}
            <div className="border border-black flex items-stretch text-xs divide-x divide-black my-2">
              {/* Left Box: Date */}
              <div className="w-1/3 p-1.5 flex items-center justify-between">
                <span className="font-bold text-[11px]">{dateHeaderLabel}</span>
                {editMode ? (
                  <input 
                    type="date"
                    value={localData.date || ''}
                    onChange={e => handleFieldChange('date', e.target.value)}
                    className="p-1 border border-slate-400 rounded text-xs font-mono font-bold"
                  />
                ) : (
                  <span className="font-mono font-bold text-xs">{localData.date || new Date().toISOString().split('T')[0]}</span>
                )}
              </div>

              {/* Center Box: DOCUMENT NO */}
              <div className="w-1/3 p-1.5 text-center flex items-center justify-center font-bold">
                <span className="mr-1">DOCUMENT NO -</span>
                {editMode ? (
                  <input 
                    type="text"
                    value={localData.docNumber || ''}
                    onChange={e => handleFieldChange('docNumber', e.target.value)}
                    className="p-1 border border-slate-400 rounded text-xs font-mono font-bold w-28 text-center"
                  />
                ) : (
                  <span className="font-mono font-black text-xs underline">{localData.docNumber}</span>
                )}
              </div>

              {/* Right Box: Project Code & Location */}
              <div className="w-1/3 p-1 text-center font-bold text-[11px] leading-tight flex flex-col justify-center">
                {editMode ? (
                  <div className="flex gap-1">
                    <input 
                      value={localData.projectCode || ''} 
                      onChange={e => handleFieldChange('projectCode', e.target.value)}
                      placeholder="Proj Code" 
                      className="p-0.5 border text-[10px] w-1/2 font-mono text-center" 
                    />
                    <input 
                      value={localData.siteLocation || ''} 
                      onChange={e => handleFieldChange('siteLocation', e.target.value)}
                      placeholder="Location" 
                      className="p-0.5 border text-[10px] w-1/2 text-center" 
                    />
                  </div>

                  <>
                    <div className="font-mono text-black font-extrabold">{localData.projectCode || 'QP 2B'}</div>
                    <div className="text-red-700 font-black uppercase text-[10px] tracking-wide">{localData.siteLocation || 'MATALE'}</div>

              <div className="border border-black bg-slate-50 text-[10px] font-mono p-1 px-2 mb-2 flex items-center justify-between">
                <div className="flex items-center gap-1 font-bold text-slate-800">
                  <span>🔗 Linked Document Chain:</span>
                  <span className="text-blue-900 bg-blue-100 px-1 py-0.2 rounded border border-blue-300">
                    Req: {localData.linkedChain.requestNo || 'REQ-001'}
                  </span>
                  <span>➔</span>
                  <span className="text-indigo-900 bg-indigo-100 px-1 py-0.2 rounded border border-indigo-300">
                    Supply: {localData.linkedChain.supplyNo || 'SUP-001'}
                  </span>
                  <span>➔</span>
                  <span className="text-emerald-900 bg-emerald-100 px-1 py-0.2 rounded border border-emerald-300">
                    Received: {localData.linkedChain.receivedNo || 'RCV-001'}
                  </span>
                </div>
                <div className="text-[9px] text-slate-600 font-sans">
                  Status: <strong className="font-mono">{localData.linkedChain.status || 'Verified'}</strong>
                </div>
              </div>

            {/* 4. DOCUMENT TITLE & PURPOSE (Exact Comtec format) */}

              <div className="font-bold text-xs font-sans text-black">
                {activeTemplate.companyName || 'Comtec Systems (Pvt) Ltd'}

                {editMode ? (
                  <input 
                    type="text"
                    value={localData.titlePurpose || ''}
                    onChange={e => handleFieldChange('titlePurpose', e.target.value)}
                    placeholder="e.g. Material Request for Matale Telecom Expansion"
                    className="w-full max-w-lg p-1 border text-center font-bold text-xs"

                  <span>{localData.titlePurpose || `${docDefaultTitle} ....................................`}</span>
                )}

            </div>

            {/* 5. PRECISION 22-ROW TABLE (Matches Attached PDF Table) */}
            <div className="border border-black mt-2">
              <table className="comtec-table text-[10.5px] leading-tight">
                <thead>
                  <tr className="bg-slate-100 text-black font-bold text-center border-b border-black">

                    <th className="py-1 px-1.5 w-[13%] text-center border-r border-black font-extrabold">IN HAND</th>

                    </th>

                <tbody className="divide-y divide-black text-black">
                  {displayRows.map((row, idx) => {
                    const isReal = !row.isEmpty && (row.description || row.qty || row.remarks);
                    return (
                      <tr key={idx} className="h-[21px] hover:bg-slate-50/50">

                        <td className="py-0.5 px-1 text-center font-mono font-medium border-r border-black">
                          {row.itemNo}
                        </td>

                        {/* Item Description */}
                        <td className="py-0.5 px-2 text-left border-r border-black">

                        {/* IN HAND */}

                        {/* REQUEST / SUPPLY / RECEIVED QTY */}
                        <td className="py-0.5 px-1.5 text-center font-mono font-bold border-r border-black">
                          {editMode ? (
                            <input 
                              type="text"
                              value={row.qty !== undefined ? row.qty : ''}
                              onChange={e => handleItemChange(idx, 'qty', e.target.value)}
                              placeholder="0"
                              className="w-full text-center p-0.5 text-[10.5px] border-b border-dotted focus:outline-none bg-transparent font-mono font-bold"
                            />
                          ) : (
                            row.qty !== undefined && row.qty !== '' ? row.qty : ''
                          )}
                        </td>

                        {/* Damage / Cutpcs / Remarks */}
                        <td className="py-0.5 px-2 text-left text-[9.5px]">
                          {editMode ? (
                            <div className="flex items-center gap-1">
                              <input 
                                type="text"
                                value={row.remarks || ''}
                                onChange={e => handleItemChange(idx, 'remarks', e.target.value)}
                                placeholder="Remarks / SLT Loan..."
                                className="w-full p-0.5 text-[9.5px] border-b border-dotted focus:outline-none bg-transparent"
                              />
                              {isReal && (
                                <button 
                                  type="button" 
                                  onClick={() => handleRemoveRow(idx)}
                                  className="text-rose-600 font-bold px-1 hover:bg-rose-50"
                                >
                                  ✕
                                </button>
                              )}
                            </div>
                          ) : (
                            <div className="truncate font-sans font-medium">
                              {row.remarks || ''}
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* 6. APPROVAL & SIGN-OFF MATRIX WITH DIGITAL SIGNATURE RENDERING */}
            <div className="border border-black border-t-0 text-[10px]">
              <table className="comtec-table">
                <tbody>
                  {/* Row 1: Prepared & Checked By */}
                  <tr className="border-b border-black">
                    <td className="w-1/4 p-1.5 font-bold border-r border-black">
                      <div className="text-[9px] text-slate-500">Date</div>
                      <div className="font-mono font-bold">{localData.date}</div>
                    </td>
                    <td className="w-1/4 p-1.5 border-r border-black">
                      <div className="text-[9px] text-slate-600 font-bold">Prepaired & Checked By</div>
                      
                      {/* Digital Signature Image Rendering */}
                      {prepSig && (
                        <div className="h-9 flex items-center justify-center my-0.5">
                          <img 
                            src={prepSig.signatureDataUrl} 
                            alt="Prepared Signature" 
                            className="max-h-8 max-w-[140px] object-contain mix-blend-multiply" 
                          />
                        </div>
                      )}

                      {editMode ? (
                        <div className="space-y-1">
                          <input 
                            value={localData.preparedBy || ''} 
                            onChange={e => handleFieldChange('preparedBy', e.target.value)}
                            placeholder="Signer Name"
                            className="w-full border-b text-[10px] font-bold p-0.5"
                          />
                          <select
                            value={localData.preparedSigId || prepSig?.id || ''}
                            onChange={e => handleFieldChange('preparedSigId', e.target.value)}
                            className="w-full text-[9px] border rounded bg-slate-50 p-0.5"
                          >
                            <option value="">No Digital Signature</option>

                        <div className="font-bold">{localData.preparedBy || activeTemplate.reviewedBy || 'Dissanayake'}</div>

                    </td>
                    <td className="w-1/4 p-1.5 border-r border-black">
                      <div className="text-[9px] text-slate-600 font-bold">Designee</div>
                      <div className="font-medium text-slate-800">{activeTemplate.designeePrepared || 'Site In-Charge'}</div>
                    </td>
                    <td className="w-1/4 p-1.5">
                      <div className="text-[9px] text-slate-600 font-bold">Department</div>
                      <div className="font-medium text-slate-800">{activeTemplate.departmentPrepared || 'Civil & Telecom Operations'}</div>

                  {/* Row 2: Approved by */}

                      <div className="font-mono font-bold">{localData.date}</div>

                    <td className="w-1/4 p-1.5 border-r border-black">

                      {/* Digital Signature Image Rendering */}
                      {apprSig && (

                      {editMode ? (

                          <select
                            value={localData.approvedSigId || apprSig?.id || ''}
                            onChange={e => handleFieldChange('approvedSigId', e.target.value)}
                            className="w-full text-[9px] border rounded bg-slate-50 p-0.5"
                          >
                            <option value="">No Digital Signature</option>
                            {digitalSignatures.map(s => (

                            ))}

                    </td>
                    <td className="w-1/4 p-1.5 border-r border-black">
                      <div className="text-[9px] text-slate-600 font-bold">Designee</div>
                      <div className="font-medium text-slate-800">{activeTemplate.designeeApproved || 'Central Project Engineer'}</div>
                    </td>
                    <td className="w-1/4 p-1.5">
                      <div className="text-[9px] text-slate-600 font-bold">Department</div>
                      <div className="font-medium text-slate-800">{activeTemplate.departmentApproved || 'Central Procurement & Logistics'}</div>
                    </td>
