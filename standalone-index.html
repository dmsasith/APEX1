    // =========================================================================
    // --- ANIMATED PROJECT BACKGROUND EFFECTS COMPONENT ---
    // =========================================================================
    function AnimatedProjectBackground({ effect = 'aurora-mesh', theme }) {
      const canvasRef = useRef(null);

      // Normalize effect name with backwards compatibility
      const currentEffect = (effect === 'none') ? 'none' :
        (effect === 'cyber-mesh') ? 'cyber-mesh' :
        (effect === 'cosmic-nodes' || effect === 'site-nodes') ? 'cosmic-nodes' :
        (effect === 'hologram-waves' || effect === 'waves') ? 'hologram-waves' : 'aurora-mesh';

      // Constellation Star Network Canvas Animation
      useEffect(() => {
        if (currentEffect !== 'cosmic-nodes') return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const starCount = Math.min(32, Math.max(14, Math.floor(width / 60)));
        const stars = Array.from({ length: starCount }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.55,
          vy: (Math.random() - 0.5) * 0.55,
          radius: Math.random() * 2.2 + 1.2,
          pulse: Math.random() * Math.PI * 2
        }));

        const accent = theme?.accentColor || '#06b6d4';
        const secAccent = theme?.secondaryAccent || '#3b82f6';

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Connect stars with glowing proximity web
          for (let i = 0; i < stars.length; i++) {
            for (let j = i + 1; j < stars.length; j++) {
              const dx = stars[i].x - stars[j].x;
              const dy = stars[i].y - stars[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 160) {
                const alpha = (1 - dist / 160) * 0.35;
                ctx.beginPath();
                ctx.moveTo(stars[i].x, stars[i].y);
                ctx.lineTo(stars[j].x, stars[j].y);
                ctx.strokeStyle = accent;
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          // Draw star vertices
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.x += s.vx;
            s.y += s.vy;
            s.pulse += 0.04;
            if (s.x < 0 || s.x > width) s.vx *= -1;
            if (s.y < 0 || s.y > height) s.vy *= -1;

            const glow = Math.sin(s.pulse) * 0.3 + 0.7;
            ctx.globalAlpha = glow * 0.75;
            ctx.fillStyle = i % 2 === 0 ? accent : secAccent;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius * (glow * 0.4 + 0.8), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1.0;

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animId);
        };
      }, [currentEffect, theme]);

      if (currentEffect === 'none') {
        return null;
      }

      if (currentEffect === 'cosmic-nodes') {
        return (
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
            <canvas ref={canvasRef} className="w-full h-full block" />
          </div>
        );
      }

      if (currentEffect === 'cyber-mesh') {
        const accent = theme?.accentColor || '#06b6d4';
        return (
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
            {/* Horizon Glow Beam */}
            <div 
              className="absolute top-1/4 left-0 right-0 h-48 opacity-35 blur-2xl"
              style={{
                background: `radial-gradient(ellipse at 50% 50%, ${accent} 0%, transparent 75%)`
              }}
            />
            {/* Perspective 3D receding ground grid */}
            <div 
              className="absolute bottom-0 left-0 right-0 h-[65vh] overflow-hidden"
              style={{ perspective: '350px' }}
            >
              <div 
                className="w-[240%] -ml-[70%] h-[160%] animate-cyber-scroll opacity-45"
                style={{
                  backgroundImage: `
                    linear-gradient(to right, ${accent}40 1.5px, transparent 1.5px),
                    linear-gradient(to bottom, ${accent}40 1.5px, transparent 1.5px)
                  `,
                  backgroundSize: '45px 45px',
                  transform: 'rotateX(60deg)',
                  transformOrigin: '50% 100%'
                }}
              />
            </div>
            {/* Top Coordinate Horizon Markers */}
            <div className="absolute top-[28%] left-1/2 -translate-x-1/2 flex items-center gap-8 text-[10px] font-mono opacity-50 font-bold" style={{ color: accent }}>
              <span>[SEC-GRID-ALPHA]</span>
              <span>◆</span>
              <span>[E204 · N98]</span>
              <span>◆</span>
              <span>[HORIZON MESH]</span>
            </div>
          </div>
        );
      }

      if (currentEffect === 'hologram-waves') {
        const accent = theme?.accentColor || '#3b82f6';
        const secAccent = theme?.secondaryAccent || '#8b5cf6';
        return (
          <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none flex flex-col justify-end">
            <svg 
              className="w-[150%] -ml-[25%] h-80 opacity-45 animate-holo-wave" 
              viewBox="0 0 1200 240" 
              preserveAspectRatio="none"
              fill="none"
            >
              <defs>
                <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor={accent} stopOpacity="0.8" />
                  <stop offset="100%" stopColor={secAccent} stopOpacity="0.6" />
                </linearGradient>
                <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor={secAccent} stopOpacity="0.7" />
                  <stop offset="100%" stopColor={accent} stopOpacity="0.5" />
                </linearGradient>
              </defs>
              <path 
                d="M0,90 C180,160 380,30 550,85 C720,140 920,40 1080,105 C1180,145 1200,80 1200,90 L1200,240 L0,240 Z" 
                fill="url(#waveGrad1)" 
                opacity="0.55"
              />
              <path 
                d="M0,130 C220,50 420,180 640,115 C860,50 1010,170 1200,125 L1200,240 L0,240 Z" 
                fill="url(#waveGrad2)" 
                opacity="0.45" 
              />
            </svg>
          </div>
        );
      }

      // Default: Ultra-Modern Fluid Aurora Mesh Gradient (Living Ambient Glow)
      const c1 = theme?.accentColor || '#10b981';
      const c2 = theme?.secondaryAccent || '#06b6d4';
      return (
        <div className="fixed inset-0 pointer-events-none z-0 overflow-hidden select-none">
          {/* Subtle Ambient Radial Light */}
          <div 
            className="absolute inset-0 opacity-25"
            style={{
              background: `radial-gradient(circle at 50% 10%, ${c1} 0%, transparent 65%)`
            }}
          />
          {/* Morphing Mesh Blob 1 */}
          <div 
            className="absolute -top-32 -left-32 w-[38rem] h-[38rem] rounded-full blur-[115px] opacity-45 animate-aurora-1"
            style={{
              background: `radial-gradient(circle, ${c1} 0%, ${c2}80 50%, transparent 75%)`
            }}
          />
          {/* Morphing Mesh Blob 2 */}
          <div 
            className="absolute top-1/4 -right-36 w-[42rem] h-[42rem] rounded-full blur-[125px] opacity-40 animate-aurora-2"
            style={{
              background: `radial-gradient(circle, ${c2} 0%, ${c1}70 55%, transparent 75%)`
            }}
          />
          {/* Morphing Mesh Blob 3 */}
          <div 
            className="absolute -bottom-40 left-1/4 w-[46rem] h-[46rem] rounded-full blur-[130px] opacity-35 animate-aurora-3"
            style={{
              background: `radial-gradient(circle, ${c1} 0%, ${c2}90 50%, transparent 75%)`
            }}
          />
          {/* Subtle Dynamic Mesh Micro-Dot Lattice for premium depth */}
          <div 
            className="absolute inset-0 opacity-[0.035] pointer-events-none"
            style={{
              backgroundImage: `radial-gradient(#ffffff 1px, transparent 1px)`,
              backgroundSize: '24px 24px'
            }}
          />
        </div>
      );
    }

                  Reset to Defaults
                </button>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 border rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-50 cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-xl text-xs font-bold shadow-md cursor-pointer transition-all active:scale-[0.99]"
                  >
                    Save & Apply Changes (සුරකින්න) ➔
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [config, setConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('apex_stock_config');
          return saved ? { ...INITIAL_CONFIG, ...JSON.parse(saved) } : INITIAL_CONFIG;
        } catch(e) { return INITIAL_CONFIG; }
      });

      // User Visual Theme & Animated Background State (Instant reactive local preference)
      const [themeId, setThemeId] = useState(() => {
        try {
          const userTheme = localStorage.getItem('apex_user_theme');
          if (userTheme) return userTheme;
          const saved = localStorage.getItem('apex_stock_config');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.themeId) return parsed.themeId;
          }
        } catch(e) {}
        return 'emerald';
      });

      const [bgEffect, setBgEffect] = useState(() => {
        try {
          const userEffect = localStorage.getItem('apex_user_effect');
          if (userEffect) return userEffect;
          const saved = localStorage.getItem('apex_stock_config');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.bgEffect) return parsed.bgEffect;
          }
        } catch(e) {}
        return 'aurora-mesh';
      });

      const [showBrandingModal, setShowBrandingModal] = useState(false);
      const [sites, setSites] = useState(INITIAL_SITES);
      const [users, setUsers] = useState(INITIAL_USERS);
      
      // Real authenticated user account (from active tab session)
      const [authAccount, setAuthAccount] = useState(() => {
        try {
          const saved = sessionStorage.getItem('apex_stock_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      // Active view user (Admin can preview site users; non-admins are strictly locked)
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = sessionStorage.getItem('apex_stock_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      const [selectedSiteForUser, setSelectedSiteForUser] = useState(null);

      // On initial link open, clear any legacy permanent localStorage so user MUST log in
      useEffect(() => {
        try { localStorage.removeItem('apex_stock_current_user'); } catch(e) {}
      }, []);
      
      const [items, setItems] = useState([]);
      const [mainStockEntries, setMainStockEntries] = useState([]);
      const [stockRequests, setStockRequests] = useState([]);
      const [teamIssues, setTeamIssues] = useState([]);
      const [teamReturns, setTeamReturns] = useState([]);
      const [siteReturns, setSiteReturns] = useState([]);
      const [siteAdjustments, setSiteAdjustments] = useState(() => {
        try {
          const saved = localStorage.getItem('apex_stock_site_adjustments');
          return saved ? JSON.parse(saved) : [];
        } catch(e) { return []; }
      });
      const [teams, setTeams] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [firebaseStatus, setFirebaseStatus] = useState('Connecting...');

      // --- LETTERHEAD TEMPLATES & DIGITAL SIGNATURES & PRINT VOUCHER MODAL STATE ---
      const [letterheadTemplates, setLetterheadTemplates] = useState(() => {
        try {
          const saved = localStorage.getItem('apex_stock_letterhead_templates');
          return saved ? JSON.parse(saved) : DEFAULT_LETTERHEAD_TEMPLATES;
        } catch(e) { return DEFAULT_LETTERHEAD_TEMPLATES; }
      });
      const [digitalSignatures, setDigitalSignatures] = useState(() => {
        try {
          const saved = localStorage.getItem('apex_stock_digital_signatures');
          return saved ? JSON.parse(saved) : DEFAULT_DIGITAL_SIGNATURES;
        } catch(e) { return DEFAULT_DIGITAL_SIGNATURES; }
      });
      const [activeTemplateId, setActiveTemplateId] = useState('tpl-comtec-default');
      const [printVoucherData, setPrintVoucherData] = useState(null);

      const isRemoteUpdate = useRef(false);

      // --- FIREBASE LIVE LISTENERS ---
      useEffect(() => {
        if (!rtdb) return;

        const handleSync = (path, setter, defVal) => {
          rtdb.ref(path).on('value', (snap) => {
            const val = snap.val();
            isRemoteUpdate.current = true;
            if (val !== null && val !== undefined) {
              const list = Array.isArray(val) ? val.filter(Boolean) : Object.values(val).filter(Boolean);
              setter(list);
            } else if (defVal !== undefined) {
              setter(defVal);
            }
            setFirebaseStatus('Connected');
            setTimeout(() => { isRemoteUpdate.current = false; }, 100);
          }, (err) => {
            setFirebaseStatus('Offline / Local');
          });
        };

        handleSync('items', setItems, []);
        handleSync('sites', setSites, INITIAL_SITES);
        handleSync('users', setUsers, INITIAL_USERS);
        handleSync('teams', setTeams, []);
        handleSync('mainStockEntries', setMainStockEntries, []);
        handleSync('stockRequests', setStockRequests, []);
        handleSync('teamIssues', setTeamIssues, []);
        handleSync('teamReturns', setTeamReturns, []);
        handleSync('siteReturns', setSiteReturns, []);
        handleSync('siteAdjustments', (val) => {
          if (Array.isArray(val)) {
            setSiteAdjustments(val);
            try { localStorage.setItem('apex_stock_site_adjustments', JSON.stringify(val)); } catch(e) {}
          } else if (val) {
            const list = Object.values(val).filter(Boolean);
            setSiteAdjustments(list);
            try { localStorage.setItem('apex_stock_site_adjustments', JSON.stringify(list)); } catch(e) {}
          } else {
            setSiteAdjustments([]);
          }
        }, []);
        handleSync('auditLogs', setAuditLogs, []);

        handleSync('letterheadTemplates', (val) => {
          if (Array.isArray(val) && val.length > 0) {
            setLetterheadTemplates(val);
            try { localStorage.setItem('apex_stock_letterhead_templates', JSON.stringify(val)); } catch(e) {}
          }
        }, DEFAULT_LETTERHEAD_TEMPLATES);

        handleSync('digitalSignatures', (val) => {
          if (Array.isArray(val) && val.length > 0) {
            setDigitalSignatures(val);
            try { localStorage.setItem('apex_stock_digital_signatures', JSON.stringify(val)); } catch(e) {}
          }
        }, DEFAULT_DIGITAL_SIGNATURES);

        rtdb.ref('config').on('value', (snap) => {
          const val = snap.val();
          if (val && val.companyName) {
            setConfig(prev => {
              const merged = { ...prev, ...val };
              try { localStorage.setItem('apex_stock_config', JSON.stringify(merged)); } catch(e) {}
              return merged;
            });
            // Adopt server theme/effect if no local override exists
            try {
              if (!localStorage.getItem('apex_user_theme') && val.themeId) {
                setThemeId(val.themeId);
              }
              if (!localStorage.getItem('apex_user_effect') && val.bgEffect) {
                setBgEffect(val.bgEffect);
              }
            } catch(e) {}
          }
        });

        return () => {
          if (rtdb) {
            ['items','sites','users','teams','mainStockEntries','stockRequests','teamIssues','teamReturns','siteReturns','siteAdjustments','auditLogs','letterheadTemplates','digitalSignatures','config'].forEach(p => rtdb.ref(p).off());
          }
        };
      }, []);

      const saveFirebase = (path, data) => {
        if (!rtdb || isRemoteUpdate.current) return;
        rtdb.ref(path).set(data).catch(err => console.error(err));
      };

      const updateConfig = (newConfig) => {
        const merged = { ...config, ...newConfig };
        setConfig(merged);
        try { localStorage.setItem('apex_stock_config', JSON.stringify(merged)); } catch(e) {}
        saveFirebase('config', merged);
      };

      const handleThemeChange = (newTheme) => {
        setThemeId(newTheme);
        try { localStorage.setItem('apex_user_theme', newTheme); } catch(e) {}
        const merged = { ...config, themeId: newTheme };
        setConfig(merged);
        try { localStorage.setItem('apex_stock_config', JSON.stringify(merged)); } catch(e) {}
        saveFirebase('config', merged);
      };

      const handleBgEffectChange = (newEffect) => {
        setBgEffect(newEffect);
        try { localStorage.setItem('apex_user_effect', newEffect); } catch(e) {}
        const merged = { ...config, bgEffect: newEffect };
        setConfig(merged);
        try { localStorage.setItem('apex_stock_config', JSON.stringify(merged)); } catch(e) {}
        saveFirebase('config', merged);
      };

      const updateItems = (newItems) => { setItems(newItems); saveFirebase('items', newItems); };
      const updateSites = (newSites) => { setSites(newSites); saveFirebase('sites', newSites); };
      const updateUsers = (newUsers) => { setUsers(newUsers); saveFirebase('users', newUsers); };
      const updateTeams = (newTeams) => { setTeams(newTeams); saveFirebase('teams', newTeams); };
      const updateEntries = (newEntries) => { setMainStockEntries(newEntries); saveFirebase('mainStockEntries', newEntries); };
      const updateRequests = (newReqs) => { setStockRequests(newReqs); saveFirebase('stockRequests', newReqs); };
      const updateIssues = (newIssues) => { setTeamIssues(newIssues); saveFirebase('teamIssues', newIssues); };
      const updateReturns = (newReturns) => { setTeamReturns(newReturns); saveFirebase('teamReturns', newReturns); };
      const updateSiteReturns = (newReturns) => { setSiteReturns(newReturns); saveFirebase('siteReturns', newReturns); };
      const updateSiteAdjustments = (newAdj) => {
        setSiteAdjustments(newAdj);
        try { localStorage.setItem('apex_stock_site_adjustments', JSON.stringify(newAdj)); } catch(e) {}
        saveFirebase('siteAdjustments', newAdj);
      };
      const updateLetterheadTemplates = (newTemplates) => {
        setLetterheadTemplates(newTemplates);
        try { localStorage.setItem('apex_stock_letterhead_templates', JSON.stringify(newTemplates)); } catch(e) {}
        saveFirebase('letterheadTemplates', newTemplates);
      };
      const updateDigitalSignatures = (newSigs) => {
        setDigitalSignatures(newSigs);
        try { localStorage.setItem('apex_stock_digital_signatures', JSON.stringify(newSigs)); } catch(e) {}
        saveFirebase('digitalSignatures', newSigs);
      };

      const handleLogin = (user) => {
        setAuthAccount(user);
        setCurrentUser(user);
        try {
          sessionStorage.setItem('apex_stock_auth_user', JSON.stringify(user));
          sessionStorage.setItem('apex_stock_current_user', JSON.stringify(user));
          localStorage.removeItem('apex_stock_current_user');
        } catch(e) {}
        addAudit('USER_LOGIN', user.username, user.siteId === 'all' ? 'Central Warehouse' : (sites.find(s=>s.id===user.siteId)?.name || 'Site'), `User ${user.fullName} logged in.`);
      };

      const handleLogout = () => {
        if (currentUser) {
          addAudit('USER_LOGOUT', currentUser.username, currentUser.siteId === 'all' ? 'Central Warehouse' : 'Site', `User ${currentUser.fullName} logged out.`);
        }
        setAuthAccount(null);
        setCurrentUser(null);
        try {
          sessionStorage.removeItem('apex_stock_auth_user');
          sessionStorage.removeItem('apex_stock_current_user');
          localStorage.removeItem('apex_stock_current_user');
        } catch(e) {}
      };

      const addAudit = (action, refNo, site, details) => {
        const log = {
          id: 'log-' + Date.now(),
          timestamp: new Date().toISOString(),
          action,
          referenceNo: refNo,
          siteName: site,
          performedBy: currentUser ? currentUser.fullName : 'System',
          details
        };
        const updated = [log, ...auditLogs].slice(0, 100);
        setAuditLogs(updated);
        saveFirebase('auditLogs', updated);
      };

      // Seed initial sample data if catalog is completely empty
      const handleSeedDemoData = () => {
        if (!confirm("Seed demo industrial items and sample requisition requests into Firebase?")) return;
        const demoItems = [
          { id: 'itm-1', itemCode: "CBL-CU-400", itemName: "400mm² Copper Armoured Power Cable XLPE 4C", category: "Electrical", unit: "Meters", unitPrice: 4500, lowStockThreshold: 30, description: "Heavy duty underground transmission cable with UV resistant black outer sheath." },
          { id: 'itm-2', itemCode: "CON-PVC-32", itemName: "32mm Rigid Heavy Duty Conduit Pipe (4m length)", category: "Conduits", unit: "Pcs", unitPrice: 520, lowStockThreshold: 40, description: "Underground orange conduit pipe with pre-moulded bell socket." },
          { id: 'itm-3', itemCode: "SWG-MCB-63", itemName: "63A 3-Pole 10kA Miniature Circuit Breaker Type C", category: "Switchgear", unit: "Pcs", unitPrice: 3800, lowStockThreshold: 15, description: "DIN-rail mounted thermal magnetic circuit breaker." },
          { id: 'itm-4', itemCode: "PPE-HLM-Y", itemName: "Industrial Safety Helmet Yellow with Ratchet", category: "Safety", unit: "Pcs", unitPrice: 1850, lowStockThreshold: 20, description: "Class E high density polyethylene helmet with 6-point suspension." }
        ];

        const demoEntries = [
          { id: 'mse-1', timestamp: new Date(Date.now() - 86400000).toISOString(), referenceNo: 'PO-2026-901', supplier: 'ACL Cables PLC', itemId: 'itm-1', quantity: 200 },
          { id: 'mse-2', timestamp: new Date(Date.now() - 86400000).toISOString(), referenceNo: 'PO-2026-902', supplier: 'Kelar PVC Products', itemId: 'itm-2', quantity: 150 },
          { id: 'mse-3', timestamp: new Date(Date.now() - 86400000).toISOString(), referenceNo: 'PO-2026-903', supplier: 'Schneider Electric', itemId: 'itm-3', quantity: 50 },
          { id: 'mse-4', timestamp: new Date(Date.now() - 86400000).toISOString(), referenceNo: 'PO-2026-904', supplier: 'Safety Gear Lanka', itemId: 'itm-4', quantity: 80 }
        ];

        const demoRequests = [
          {
            id: 'sr-1',
            requestNoteNumber: 'RN-2026-101',
            requestedDate: new Date(Date.now() - 3600000).toISOString(),
            requestedBy: 'Sunil Perera',
            siteId: 'site-colombo',
            status: 'Pending',
            items: [
              { itemId: 'itm-1', itemCode: 'CBL-CU-400', itemName: '400mm² Copper Armoured Power Cable XLPE 4C', unit: 'Meters', requestedQty: 40, approvedQty: 40 },
              { itemId: 'itm-2', itemCode: 'CON-PVC-32', itemName: '32mm Rigid Heavy Duty Conduit Pipe (4m length)', unit: 'Pcs', requestedQty: 25, approvedQty: 25 }

        updateItems(demoItems);
        updateEntries(demoEntries);
        updateRequests(demoRequests);
        addAudit('DATA_SEEDED', 'SYS-DEMO', 'Central Warehouse', 'Demo catalog items and sample requisition created.');
        alert("Demo data loaded successfully!");
      };

      // --- ACCURATE STOCK BALANCE CALCULATIONS (Includes Returns from Sites to Main Depot) ---
      const getMainStock = (itemId) => {
        const item = items.find(i => i.id === itemId);
        const threshold = item?.lowStockThreshold || config.defaultLowStockThreshold;
        const totalReceived = mainStockEntries
          .filter(e => e.itemId === itemId)
          .reduce((sum, e) => sum + Number(e.quantity || 0), 0);

        // Stock returned from site branches back to Main Central Warehouse in Good condition
        const returnedFromSites = siteReturns
          .filter(r => r.itemId === itemId && (r.condition === 'Good' || !r.condition))
          .reduce((sum, r) => sum + Number(r.quantity || 0), 0);

        const dispatched = stockRequests
          .filter(r => r.status === 'Approved' || r.status === 'Accepted')
          .reduce((sum, r) => {
            const row = (r.items || []).find(i => i.itemId === itemId);
            return sum + (row ? Number(row.approvedQty !== undefined ? row.approvedQty : row.requestedQty) : 0);
          }, 0);

        const availableBalance = Math.max(0, totalReceived + returnedFromSites - dispatched);
        const isLow = (totalReceived + returnedFromSites) > 0 && availableBalance <= threshold;
        return { totalReceived, returnedFromSites, dispatched, availableBalance, threshold, isLow };
      };

      const getSiteStock = (siteId, itemId) => {
        const item = items.find(i => i.id === itemId);
        const threshold = item?.lowStockThreshold || config.defaultLowStockThreshold;

        // Resolve target site object to match by ID, Name and Location flexibly
        const targetSite = sites.find(s => s.id === siteId || (s.name && s.name.trim().toLowerCase() === String(siteId).trim().toLowerCase()));
        const isSiteMatch = (recSiteId, recSiteName) => {
          if (!recSiteId && !recSiteName) return false;
          if (recSiteId === siteId) return true;
          if (recSiteName && (recSiteName === siteId || (targetSite && recSiteName.trim().toLowerCase() === targetSite.name.trim().toLowerCase()))) return true;
          if (targetSite) {
            if (recSiteId === targetSite.id) return true;
            if (targetSite.name && String(recSiteId).trim().toLowerCase() === targetSite.name.trim().toLowerCase()) return true;
          }
          return false;
        };

        const isItemMatch = (recItemId, recItemCode) => {
          if (!recItemId && !recItemCode) return false;
          if (recItemId === itemId) return true;
          if (item && (recItemId === item.id || (recItemCode && recItemCode === item.itemCode))) return true;
          return false;
        };

        // Received from Main Depot: includes Accepted (gate confirmed) and Approved (dispatched / in-transit to site)
        const received = stockRequests
          .filter(r => isSiteMatch(r.siteId, r.siteName) && (r.status === 'Accepted' || r.status === 'Approved'))
          .reduce((sum, r) => {
            const row = (r.items || []).find(i => isItemMatch(i.itemId || i.id, i.itemCode));
            return sum + (row ? Number(row.receivedQty !== undefined ? row.receivedQty : (row.approvedQty !== undefined ? row.approvedQty : row.requestedQty)) : 0);
          }, 0);

        // Direct yard adjustments, physical stock audits, or opening balances
        const adjustments = (siteAdjustments || [])
          .filter(a => isSiteMatch(a.siteId, a.siteName) && isItemMatch(a.itemId, a.itemCode))
          .reduce((sum, a) => sum + Number(a.quantity || 0), 0);

        const returnedFromTeams = teamReturns
          .filter(ret => isSiteMatch(ret.siteId, ret.siteName) && isItemMatch(ret.itemId, ret.itemCode) && ret.condition === 'Good')
          .reduce((sum, ret) => sum + Number(ret.quantity || 0), 0);

        const issued = teamIssues
          .filter(iss => isSiteMatch(iss.siteId, iss.siteName))
          .reduce((sum, iss) => {
            const row = (iss.items || []).find(i => isItemMatch(i.itemId || i.id, i.itemCode));
            return sum + (row ? Number(row.quantity || 0) : 0);
          }, 0);

        // Deduct quantities returned by this site back to Main Central Warehouse
        const returnedToMain = siteReturns
          .filter(r => isSiteMatch(r.sourceSiteId, r.sourceSiteName) && isItemMatch(r.itemId, r.itemCode))
          .reduce((sum, r) => sum + Number(r.quantity || 0), 0);

        const availableBalance = Math.max(0, received + adjustments + returnedFromTeams - issued - returnedToMain);
        const hasActivity = received > 0 || adjustments !== 0 || returnedToMain > 0 || issued > 0;
        const isLow = hasActivity && availableBalance <= threshold;
        return { received, adjustments, returned: returnedFromTeams, issued, returnedToMain, availableBalance, threshold, isLow, hasActivity };
      };

      // Low Stock Alerts
      const lowStockAlerts = useMemo(() => {
        let alerts = [];
        items.forEach(item => {
          const main = getMainStock(item.id);
          if (main.isLow) {
            alerts.push({ location: 'Main Central Warehouse', item, balance: main.availableBalance, threshold: main.threshold });
          }
        });
        sites.filter(s => !s.isMainWarehouse).forEach(site => {
          items.forEach(item => {
            const siteStk = getSiteStock(site.id, item.id);
            if (siteStk.isLow) {
              alerts.push({ location: site.name, item, balance: siteStk.availableBalance, threshold: siteStk.threshold });
            }
          });
        });
        return alerts;
      }, [items, sites, mainStockEntries, stockRequests, teamIssues, teamReturns, siteReturns, siteAdjustments]);

      const Icon = ({ name, className = "w-4 h-4" }) => {
        if (name === 'dashboard') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>;
        if (name === 'items') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>;
        if (name === 'main-stock') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>;
        if (name === 'sites') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>;
        if (name === 'requests') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>;
        if (name === 'dispatch') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>;
        if (name === 'returns') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>;
        if (name === 'teams') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>;
        if (name === 'users') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
        if (name === 'audit') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>;
        if (name === 'printer' || name === 'document') return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>;
        return <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>;
      };

      // Open Print Letterhead Voucher Modal with auto-linked document sequence
      const openPrintVoucherForRequest = (req, mode = 'request') => {
        const site = sites.find(s => s.id === req.siteId);
        const reqIdx = stockRequests.indexOf(req);
        const seq = req.docSeq || (reqIdx >= 0 ? reqIdx + 1 : 1);
        const paddedSeq = String(seq).padStart(3, '0');
        const reqNo = req.requestDocNo || req.requestNoteNumber || `REQ-2026-${paddedSeq}`;
        const supNo = req.supplyDocNo || `SUP-2026-${paddedSeq}`;
        const rcvNo = req.receivedDocNo || `RCV-2026-${paddedSeq}`;

        let docNo = reqNo;
        let docTitle = `Material Request for ${site?.name || 'Site Requisition'}`;
        let dateVal = req.requestedDate || new Date().toISOString();
        if (mode === 'supply') {
          docNo = supNo;
          docTitle = `Material Supply Note for ${site?.name || 'Site Delivery'}`;
          dateVal = req.approvalDate || req.requestedDate || new Date().toISOString();
        } else if (mode === 'received') {
          docNo = rcvNo;
          docTitle = `Material Goods Received (GRN) for ${site?.name || 'Site Inward'}`;
          dateVal = req.acceptanceDate || req.approvalDate || new Date().toISOString();
        }

        const itemsData = (req.items || []).map((row, idx) => {
          const inHand = getSiteStock(req.siteId, row.itemId)?.availableBalance;
          let qty = row.requestedQty;
          if (mode === 'supply') qty = row.approvedQty !== undefined ? row.approvedQty : row.requestedQty;
          if (mode === 'received') qty = row.receivedQty !== undefined ? row.receivedQty : (row.approvedQty !== undefined ? row.approvedQty : row.requestedQty);
          return {
            itemNo: idx + 1,
            itemCode: row.itemCode,
            description: row.itemName,
            unit: row.unit || 'Nos',
            inHand: inHand !== undefined ? inHand : '-',
            qty: qty,
            remarks: row.remarks || (mode === 'supply' && req.approvalNotes ? req.approvalNotes : (mode === 'received' && req.acceptanceNotes ? req.acceptanceNotes : ''))
          };
        });

        setPrintVoucherData({
          mode,
          docType: mode,
          docNumber: docNo,
          date: dateVal.split('T')[0],
          projectCode: site?.projectCode || 'QP 2B',
          siteLocation: (site?.location || site?.name || 'CENTRAL LOGISTICS').toUpperCase(),
          siteName: site?.name || 'Site Branch',
          titlePurpose: docTitle,
          linkedChain: {
            requestNo: reqNo,
            supplyNo: supNo,
            receivedNo: rcvNo,
            status: req.status
          },
          items: itemsData,
          preparedBy: req.requestedBy || currentUser?.fullName || 'Store Officer',
          approvedBy: isCentralAdmin ? (currentUser?.fullName || 'Arthur Vance') : (req.approvedBy || 'Arthur Vance'),
          reviewedBy: 'Dissanayake',
          designeePrepared: 'Site In-Charge / Supervisor',
          designeeApproved: 'Central Project Engineer',
          departmentPrepared: 'Telecom & Civil Construction',
          departmentApproved: 'Central Logistics Depot',
          issueNo: '01',
          revisionNo: '00'
        });
      };

      const openPrintVoucherForReturn = (ret) => {
        const site = sites.find(s => s.id === (ret.sourceSiteId || ret.siteId));
        const item = items.find(i => i.id === ret.itemId);
        const retIdx = siteReturns.indexOf(ret);
        const seq = (retIdx >= 0 ? retIdx + 1 : 1);
        const retNo = ret.returnVoucherNumber || ret.voucherNumber || `RET-2026-${String(seq).padStart(3, '0')}`;

        setPrintVoucherData({
          mode: 'return',
          docType: 'return',
          docNumber: retNo,
          date: (ret.returnDate || ret.date || ret.timestamp || new Date().toISOString()).split('T')[0],
          projectCode: site?.projectCode || 'QP 2B',
          siteLocation: (site?.location || site?.name || 'SITE YARD').toUpperCase(),
          siteName: site?.name || 'Site Yard',
          titlePurpose: `Material Return to Main Branch for ${site?.name || 'Site Recovery'}`,
          linkedChain: {
            requestNo: ret.linkedRequestNo || 'REF-REQ',
            supplyNo: ret.linkedSupplyNo || 'REF-SUP',
            receivedNo: '-',
            returnNo: retNo
          },
          items: [
            {
              itemNo: 1,
              itemCode: item?.itemCode || ret.itemCode || 'ITEM',
              description: item?.itemName || ret.itemName || 'Material Item',
              unit: item?.unit || ret.unit || 'Nos',
              inHand: '-',
              qty: ret.quantity,
              remarks: `Condition: ${ret.condition || 'Good'} · ${ret.reason || 'Surplus unused material'}`
            }
          ],
          preparedBy: ret.returnedBy || currentUser?.fullName || 'Supervisor',
          approvedBy: 'Arthur Vance',
          reviewedBy: 'Dissanayake',
          designeePrepared: 'Site Logistics In-Charge',
          designeeApproved: 'Central Store Manager',
          departmentPrepared: 'Field Engineering Site',
          departmentApproved: 'Central Logistics & Procurement',
          issueNo: '01',
          revisionNo: '00'
        });
      };

      const openPrintVoucherForManual = (type = 'request') => {
        const defaultSite = sites.find(s => !s.isMainWarehouse) || sites[0];
        const seq = (stockRequests.length + 1);
        const paddedSeq = String(seq).padStart(3, '0');
        const reqNo = `REQ-2026-${paddedSeq}`;
        const supNo = `SUP-2026-${paddedSeq}`;
        const rcvNo = `RCV-2026-${paddedSeq}`;

        let docNo = reqNo;
        let docTitle = `Material Request for ${defaultSite?.name || 'Site Operations'}`;
        if (type === 'supply') {
          docNo = supNo;
          docTitle = `Material Supply Note for ${defaultSite?.name || 'Site Operations'}`;
        } else if (type === 'received') {
          docNo = rcvNo;
          docTitle = `Material Goods Received (GRN) for ${defaultSite?.name || 'Site Operations'}`;
        } else if (type === 'return') {
          docNo = `RET-2026-${paddedSeq}`;
          docTitle = `Material Return to Main Branch for ${defaultSite?.name || 'Site Recovery'}`;
        }

        setPrintVoucherData({
          mode: type,
          docType: type,
          docNumber: docNo,
          date: new Date().toISOString().split('T')[0],
          projectCode: 'QP 2B',
          siteLocation: (defaultSite?.location || 'MATALE').toUpperCase(),
          siteName: defaultSite?.name || 'Site Branch',
          titlePurpose: docTitle,
          linkedChain: {
            requestNo: reqNo,
            supplyNo: supNo,
            receivedNo: rcvNo,
            status: 'Draft'
          },
          items: items.slice(0, 5).map((it, idx) => ({
            itemNo: idx + 1,
            itemCode: it.itemCode,
            description: it.itemName,
            unit: it.unit,
            inHand: 10,
            qty: 25,
            remarks: ''
          })),
          preparedBy: currentUser?.fullName || 'Operations Officer',
          approvedBy: 'Arthur Vance',
          reviewedBy: 'Dissanayake',
          designeePrepared: 'Site In-Charge',
          designeeApproved: 'Central Project Engineer',
          departmentPrepared: 'Telecom & Civil Operations',
          departmentApproved: 'Central Logistics Depot',
          issueNo: '01',
          revisionNo: '00'
        });
      };

      // Open Print Letterhead Voucher Modal for Inward Supplier Shipments (GRN)
      const openPrintVoucherForInwardEntry = (entry, selectedItem) => {
        const item = selectedItem || items.find(i => i.id === entry.itemId);
        const entryDate = entry.date || (entry.timestamp ? entry.timestamp.split('T')[0] : new Date().toISOString().split('T')[0]);
        const poRef = entry.referenceNo || 'PO-MAIN-001';
        const supInv = entry.supplierInvoiceNo || entry.supInvNo || 'INV-SUP-01';
        const supplierName = entry.supplier || 'Main Vendor / Supplier';
        const docNo = entry.inwardDocNo || `GRN-2026-${String(entry.id || '').replace(/\D/g, '').slice(-4) || '001'}`;

        const defaultPreparedSig = digitalSignatures.find(s => s.name.toLowerCase().includes('dissanayake')) || digitalSignatures[1] || digitalSignatures[0];
        const defaultApprovedSig = digitalSignatures.find(s => s.name.toLowerCase().includes('arthur')) || digitalSignatures[0];

        setPrintVoucherData({
          mode: 'received',
          docType: 'received',
          docNumber: docNo,
          date: entryDate,
          projectCode: 'CENTRAL DEPOT',
          siteLocation: 'CENTRAL LOGISTICS WAREHOUSE',
          siteName: 'Central Logistics & Procurement Depot',
          titlePurpose: `Supplier Inward Goods Received Note (GRN) from ${supplierName}`,
          linkedChain: {
            requestNo: `PO Ref: ${poRef}`,
            supplyNo: `Sup Inv: ${supInv}`,
            receivedNo: docNo,
            status: 'Delivered & Accepted'
          },
          items: [
            {
              itemNo: 1,
              itemCode: item?.itemCode || 'ITEM-01',
              description: item?.itemName || 'Material Item',
              unit: item?.unit || 'Nos',
              inHand: getMainStock(item?.id || entry.itemId)?.availableBalance || '-',
              qty: entry.quantity,
              remarks: `Supplier: ${supplierName} · Inv: ${supInv} · PO: ${poRef} ${entry.notes ? '· ' + entry.notes : ''}`
            }
          ],
          preparedBy: entry.receivedBy || currentUser?.fullName || 'Store Officer',
          approvedBy: 'Arthur Vance',
          reviewedBy: 'Dissanayake',
          designeePrepared: 'Central Inbound Store Keeper',
          designeeApproved: 'Central Project Engineer',
          departmentPrepared: 'Central Inventory & Quality Check',
          departmentApproved: 'Central Logistics & Procurement',
          preparedSigId: defaultPreparedSig?.id,
          reviewedSigId: defaultPreparedSig?.id,
          approvedSigId: defaultApprovedSig?.id,
          issueNo: '01',
          revisionNo: '00'
        });
      };

      // 1. GATEKEEPING: If no user is logged in, render the Login Screen completely
      const activeTheme = THEMES.find(t => t.id === themeId) || THEMES[0];
      const activeBgEffect = bgEffect || 'aurora-mesh';

      // Full interface dark mode synchronization
      useEffect(() => {
        if (activeTheme?.isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [activeTheme?.isDark]);

      if (!authAccount || !currentUser) {
        return (
          <LoginView 
            users={users} 
            onLogin={handleLogin} 
            config={config} 
            themeId={themeId}
            bgEffect={bgEffect}
            onThemeChange={handleThemeChange}
            onBgEffectChange={handleBgEffectChange}
            themes={THEMES}
            bgEffects={BG_EFFECTS}
          />
        );
      }

      const assignedSite = sites.find(s => s.id === currentUser.siteId);
      const isRealAdmin = authAccount?.role === 'Central Warehouse Admin';
      const isCentralAdmin = currentUser?.role === 'Central Warehouse Admin';
      const isPreviewMode = isRealAdmin && currentUser.id !== authAccount.id;

      return (
        <div className={`min-h-screen flex flex-col ${activeTheme.bodyBg} relative transition-colors`}>
          {/* PROJECT ANIMATED BACKGROUND EFFECT (Dynamic: Aurora Mesh, Cyber Grid, Star Network, Holo Waves, Clean Solid) */}
          <AnimatedProjectBackground effect={activeBgEffect} theme={activeTheme} />

          {/* ADMIN PREVIEW MODE ALERT BANNER */}
          {isPreviewMode && (
            <div className="bg-amber-500 text-slate-950 font-medium px-4 py-2 text-xs flex items-center justify-between border-b border-amber-600 shadow-sm z-40">
              <div className="flex items-center gap-2">
                <span className="font-black text-sm">⚠️</span>
                <span>
                  <strong>Admin Preview Mode Active:</strong> You are simulating the view as <strong>{currentUser.fullName}</strong> ({assignedSite ? assignedSite.name : currentUser.role}). Standard site users cannot switch views.
                </span>
              </div>
              <button 
                onClick={() => {
                  setCurrentUser(authAccount);
                  try { sessionStorage.setItem('apex_stock_current_user', JSON.stringify(authAccount)); } catch(e) {}
                }}
                className="px-2.5 py-1 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded text-[11px] transition-colors shadow-xs cursor-pointer"
              >
                Exit Preview & Return to Admin ➔
              </button>
            </div>
          )}

          {/* TOP HEADER */}
          <header className={`${activeTheme.headerBg} ${activeTheme.headerBorder} text-white sticky top-0 z-30 border-b shadow-sm transition-colors`}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              {/* COMPANY BRANDING & LOGO (Clean uncrowded display) */}
              <div className="flex items-center gap-2.5 min-w-0">
                <CompanyLogoBadge config={config} theme={activeTheme} className="w-10 h-10" textClassName="text-lg" />
                <div className="min-w-0">
                  <div className={`font-bold text-base leading-tight truncate ${activeTheme.headerText}`}>
                    {config.companyName || 'Comtec Systems'}
                  </div>
                  <div className={`text-xs font-medium truncate ${activeTheme.headerSubText}`}>
                    {config.systemName || 'Apex Stock & Site Management System'}
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3 shrink-0">
                {lowStockAlerts.length > 0 && (
                  <div className="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded bg-rose-500/10 border border-rose-500/30 text-rose-300 font-semibold text-xs">
                    <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                    <span>{lowStockAlerts.length} Low Stock</span>
                  </div>
                )}

                {/* COMPACT THEME SELECTOR DROPDOWN (Short names & compact badge) */}
                <div className="hidden lg:flex items-center gap-1.5 bg-black/40 border border-white/20 rounded-lg px-2 py-1 text-xs backdrop-blur-md shadow-xs" title="Select Visual Theme & Dark Mode">
                  <span className="text-[11px] select-none">🎨</span>
                  <select 
                    value={themeId}
                    onChange={e => handleThemeChange(e.target.value)}
                    className="bg-transparent text-white font-bold focus:outline-none cursor-pointer text-xs rounded max-w-[115px] truncate"
                  >
                    {THEMES.map(t => (
                      <option key={t.id} value={t.id} className="bg-slate-950 text-white">
                        {t.shortName || t.name.split(' (')[0]}
                      </option>
                    ))}
                  </select>
                </div>

                {/* COMPACT ANIMATED BACKGROUND DROPDOWN (Short names & compact badge) */}
                <div className="hidden md:flex items-center gap-1.5 bg-black/40 border border-white/20 rounded-lg px-2 py-1 text-xs backdrop-blur-md shadow-xs" title="Select Background Mesh Effect">
                  <span className="text-[11px] select-none">✨</span>
                  <select 
                    value={activeBgEffect}
                    onChange={e => handleBgEffectChange(e.target.value)}
                    className="bg-transparent text-white font-bold focus:outline-none cursor-pointer text-xs rounded max-w-[110px] truncate"
                  >
                    {BG_EFFECTS.map(bg => (
                      <option key={bg.id} value={bg.id} className="bg-slate-950 text-white">
                        {bg.shortName || bg.name.split(' (')[0]}
                      </option>
                    ))}
                  </select>
                </div>

                {/* ROLE-AWARE IDENTITY CARD & USER SWITCHING */}
                {isRealAdmin ? (
                  /* ONLY Real Admin has the ability to switch/preview views */
                  <div className="flex items-center gap-2 bg-slate-800/90 border border-amber-500/40 rounded-lg px-2.5 py-1 text-xs">
                    <span className="text-amber-400 font-bold text-[10px] hidden md:inline">⚡ Admin View:</span>
                    <select 
                      value={currentUser.id} 
                      onChange={e => {
                        const targetUser = users.find(u => u.id === e.target.value) || authAccount;
                        setCurrentUser(targetUser);
                        try { sessionStorage.setItem('apex_stock_current_user', JSON.stringify(targetUser)); } catch(err) {}
                      }}
                      className="bg-slate-900 text-white font-medium focus:outline-none cursor-pointer text-xs rounded px-1.5 py-0.5 border border-slate-700 max-w-[140px] sm:max-w-none truncate"
                    >
                      <option value={authAccount.id}>👑 {authAccount.fullName} (Super Admin)</option>
                      {users.filter(u => u.id !== authAccount.id).map(u => (
                        <option key={u.id} value={u.id}>👷 {u.fullName} ({sites.find(s=>s.id===u.siteId)?.name || u.role})</option>
                      ))}
                    </select>
                  </div>
                ) : (
                  /* SITE USER: Strictly locked display with NO dropdown or switcher! */
                  <div className="flex items-center gap-2 bg-slate-800/90 border border-slate-700 rounded-lg px-3 py-1.5 text-xs shadow-inner">
                    <div className="w-2 h-2 rounded-full bg-blue-400"></div>
                    <div>
                      <div className="font-bold text-slate-100 leading-tight">{currentUser.fullName}</div>
                      <div className="text-[10px] text-blue-300 font-mono">
                        {assignedSite ? assignedSite.name : 'Site Yard'} (🔒 Locked Branch)
                      </div>
                    </div>
                  </div>
                )}

                <div className="hidden md:flex items-center gap-1.5 px-2.5 py-1 rounded bg-slate-800/80 text-[11px] font-mono text-slate-300">
                  <span className={`w-2 h-2 rounded-full ${firebaseStatus === 'Connected' ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                  <span>{firebaseStatus}</span>
                </div>

                {isCentralAdmin && (
                  <button
                    onClick={handleSeedDemoData}
                    className="hidden xl:block px-2.5 py-1 bg-emerald-700 hover:bg-emerald-600 text-white rounded text-xs font-semibold cursor-pointer"
                    title="Populate catalog with demo industrial items"
                  >
                    Load Demo
                  </button>
                )}

                {/* SIGN OUT BUTTON */}
                <button
                  onClick={handleLogout}
                  className="px-2.5 py-1 bg-rose-600/80 hover:bg-rose-600 text-white rounded-lg text-xs font-bold transition-colors flex items-center gap-1 cursor-pointer"
                  title="Sign out of your session"
                >
                  <span>Logout</span>
                  <span>➔</span>
                </button>
              </div>
            </div>
          </header>

          {/* MAIN BODY: SIDEBAR + CONTENT */}
          <div className="flex-1 flex max-w-7xl w-full mx-auto">
            {/* LEFT SIDEBAR NAVIGATION */}
            <aside className="w-64 bg-white/90 backdrop-blur-xs border-r border-slate-200 shrink-0 p-4 hidden md:flex flex-col justify-between">
              <div>
                <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-3 mb-2 flex items-center justify-between">
                  <span>Operations Navigation</span>
                  <span className="text-[10px] text-emerald-600 font-mono">{isCentralAdmin ? 'Admin Mode' : 'Site Mode'}</span>
                </div>
                <nav className="space-y-1">
                  {[
                    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', badge: lowStockAlerts.length ? `${lowStockAlerts.length}` : null },
                    { id: 'items', label: 'Items Catalog', icon: 'items', sub: isCentralAdmin ? 'Import Excel & Add Items' : 'Master Items (Read-Only)' },
                    { id: 'main-stock', label: 'Main Central Stock', icon: 'main-stock', sub: isCentralAdmin ? 'PO & Inbound Receiving' : 'Depot Balances (Read-Only)' },
                    { id: 'sites', label: 'Sites & Branches', icon: 'sites', sub: isCentralAdmin ? 'Register & Manage Sites' : 'Site Yard Inventory' },
                    { id: 'requests', label: isCentralAdmin ? 'Branch Requisitions' : 'My Requests & Requisitions', icon: 'requests', badge: stockRequests.filter(r => r.status === 'Pending').length || null },
                    { id: 'dispatch', label: 'Issue to Teams', icon: 'dispatch', sub: 'Daily Field Dispatch' },
                    { id: 'returns', label: 'Team Returns', icon: 'returns', sub: 'Recovery Notes' },
                    { id: 'teams', label: 'Field Teams Stock', icon: 'teams', sub: 'In-Hand Balances' },
                    { id: 'letterhead', label: 'Print & Letterhead Center', icon: 'printer', sub: 'Comtec & Custom Vouchers' },
                    ...(isRealAdmin ? [
                      { id: 'users', label: 'User Accounts (RBAC)', icon: 'users', sub: 'Register & Manage Users' }
                    ] : []),
                    { id: 'audit', label: 'Audit Trail & Logs', icon: 'audit' },
                  ].map(item => {
                    const isActive = currentTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full text-left px-3 py-2.5 rounded-lg text-xs font-semibold flex items-center justify-between transition-colors ${
                          isActive ? (activeTheme.activeNav || 'bg-slate-900 text-white shadow-sm') : 'text-slate-700 hover:bg-slate-100'
                        }`}
                      >
                        <div className="flex items-center gap-2.5">
                          <Icon name={item.icon} className={`w-4 h-4 ${isActive ? (activeTheme.activeNavIcon || 'text-emerald-400') : 'text-slate-400'}`} />
                          <div>
                            <div>{item.label}</div>
                            {item.sub && <div className={`text-[10px] font-normal ${isActive ? 'text-slate-200' : 'text-slate-400'}`}>{item.sub}</div>}
                          </div>
                        </div>
                        {item.badge && (
                          <span className="px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-500 text-white">
                            {item.badge}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </nav>
              </div>

              {/* SIDEBAR BOTTOM CONTROLS */}
              <div className="pt-3 mt-4 border-t border-slate-200 space-y-2.5">
                {/* QUICK THEME & EFFECT SELECTOR (Available to all users) */}
                <div className="bg-slate-50/90 border border-slate-200 rounded-xl p-2.5 space-y-2">
                  <div className="text-[11px] font-bold text-slate-700 flex items-center justify-between">
                    <span className="flex items-center gap-1">🎨 <span>Theme & Effects</span></span>
                    <span className="text-[9px] text-slate-400 font-mono">Workspace</span>
                  </div>
                  <div className="space-y-1.5">
                    <div>
                      <label className="text-[10px] text-slate-500 font-semibold block mb-0.5">Theme (වර්ණ තේමාව):</label>
                      <select
                        value={themeId}
                        onChange={e => handleThemeChange(e.target.value)}
                        className="w-full px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 font-medium focus:outline-none cursor-pointer"
                      >
                        {THEMES.map(t => (
                          <option key={t.id} value={t.id}>{t.shortName || t.name}</option>
                        ))}
                      </select>

    // --- ITEMS MANAGEMENT ---
    function ItemsView({ items, onUpdateItems, isCentralAdmin, addAudit }) {
      const [search, setSearch] = useState('');
      const [code, setCode] = useState('');
      const [name, setName] = useState('');
      const [category, setCategory] = useState('Electrical');
      const [unit, setUnit] = useState('Pcs');
      const [threshold, setThreshold] = useState(15);
      const [price, setPrice] = useState(150);

      const filtered = items.filter(i => 
        i.itemCode.toLowerCase().includes(search.toLowerCase()) || 
        i.itemName.toLowerCase().includes(search.toLowerCase())
      );

      const handleDownloadTemplate = () => {
        const sampleData = [
          { "Item Code": "CBL-CU-400", "Item Name": "400mm² Copper Cable XLPE", "Category": "Electrical", "Unit": "Meters", "Unit Price": 4500, "Min Threshold": 20, "Description": "Main heavy duty transmission" },
          { "Item Code": "ST-BAR-16", "Item Name": "16mm TMT Deformed Steel Bar", "Category": "Structural Steel", "Unit": "Pcs", "Unit Price": 1200, "Min Threshold": 50, "Description": "High tensile rebar" },
          { "Item Code": "CONC-C30", "Item Name": "Ready-Mix Concrete Grade 30", "Category": "Civil", "Unit": "Bags", "Unit Price": 1850, "Min Threshold": 30, "Description": "Standard foundation bag" },
          { "Item Code": "PPE-HLM-Y", "Item Name": "Industrial Safety Helmet Yellow", "Category": "Safety", "Unit": "Pcs", "Unit Price": 750, "Min Threshold": 15, "Description": "Class E certified" }
        ];
        const ws = XLSX.utils.json_to_sheet(sampleData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Items_Template");
        XLSX.writeFile(wb, "Item_Master_Template.xlsx");
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            
            let added = 0;
            let updated = 0;
            let current = [...items];

            json.forEach(row => {
              const itemCode = String(row["Item Code"] || row["itemCode"] || "").trim().toUpperCase();
              const itemName = String(row["Item Name"] || row["itemName"] || "").trim();
              if (!itemCode || !itemName) return;

              const existingIdx = current.findIndex(i => i.itemCode.toUpperCase() === itemCode);
              const newItem = {
                id: 'item-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                itemCode,
                itemName,
                category: String(row["Category"] || row["category"] || "General"),
                unit: String(row["Unit"] || row["unit"] || "Pcs"),
                unitPrice: Number(row["Unit Price"] || row["unitPrice"] || 0),
                lowStockThreshold: Number(row["Min Threshold"] || row["lowStockThreshold"] || 15),
                description: String(row["Description"] || row["description"] || itemName)
              };

              if (existingIdx >= 0) {
                current[existingIdx] = { ...current[existingIdx], ...newItem, id: current[existingIdx].id };
                updated++;
              } else {
                current.push(newItem);
                added++;
              }
            });

            onUpdateItems(current);
            addAudit('EXCEL_IMPORT', `IMP-${Date.now()}`, 'Central Warehouse', `Imported Excel: ${added} added, ${updated} updated.`);
            alert(`Excel Import Success! ${added} new items added, ${updated} items updated.`);
          } catch (err) {
            alert("Error parsing Excel file. Please use the downloaded template.");
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleManualAdd = (e) => {
        e.preventDefault();
        const upper = code.trim().toUpperCase();
        if (items.some(i => i.itemCode.toUpperCase() === upper)) {
          alert(`Item Code "${upper}" already exists!`);
          return;
        }
        const newItem = {
          id: 'item-' + Date.now(),
          itemCode: upper,
          itemName: name.trim(),
          category,
          unit,
          lowStockThreshold: Number(threshold),
          unitPrice: Number(price)
        };
        onUpdateItems([...items, newItem]);
        addAudit('ITEM_CREATED', upper, 'Central Warehouse', `Created item ${upper} - ${name}`);
        setCode(''); setName('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900">Items Master Management</h1>
              <p className="text-xs text-slate-600">Download formatted .xlsx template, upload bulk items, or manage catalog specifications.</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={handleDownloadTemplate} className="px-3 py-2 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-lg text-xs font-semibold hover:bg-emerald-100">
                📥 Download Template (.xlsx)
              </button>
              {isCentralAdmin && (
                <label className="px-3.5 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold cursor-pointer hover:bg-slate-800">
                  📤 Upload Excel File
                  <input type="file" accept=".xlsx, .xls" onChange={handleFileUpload} className="hidden" />
                </label>
              )}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {isCentralAdmin ? (
              <form onSubmit={handleManualAdd} className="lg:col-span-4 bg-white p-5 rounded-xl border border-slate-200 space-y-3">
                <h2 className="font-bold text-sm text-slate-900 border-b pb-2">Add Master Item</h2>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Item Code *</label>
                  <input required value={code} onChange={e => setCode(e.target.value)} placeholder="e.g. CBL-CU-400" className="w-full px-3 py-1.5 border rounded text-xs font-mono uppercase focus:ring-1 focus:ring-slate-900" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Item Name *</label>
                  <input required value={name} onChange={e => setName(e.target.value)} placeholder="Full specification" className="w-full px-3 py-1.5 border rounded text-xs focus:ring-1 focus:ring-slate-900" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Category</label>
                    <input value={category} onChange={e => setCategory(e.target.value)} className="w-full px-3 py-1.5 border rounded text-xs" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Unit</label>
                    <input value={unit} onChange={e => setUnit(e.target.value)} className="w-full px-3 py-1.5 border rounded text-xs" />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Min Threshold</label>
                    <input type="number" value={threshold} onChange={e => setThreshold(e.target.value)} className="w-full px-3 py-1.5 border rounded text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Unit Price (Rs.)</label>
                    <input type="number" value={price} onChange={e => setPrice(e.target.value)} className="w-full px-3 py-1.5 border rounded text-xs font-mono" />
                  </div>
                </div>
                <button type="submit" className="w-full py-2 bg-slate-900 text-white rounded text-xs font-semibold hover:bg-slate-800">
                  Save Item
                </button>
              </form>
            ) : (
              <div className="lg:col-span-4 bg-white p-6 rounded-xl border border-slate-200 text-center">
                <div className="text-3xl mb-2">🔒</div>
                <h3 className="font-bold text-sm text-slate-900">Catalog Read-Only</h3>
                <p className="text-xs text-slate-500 mt-1">Only Central Warehouse Admin can add or edit master catalog items.</p>
              </div>
            )}

            <div className="lg:col-span-8 bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col">
              <div className="p-3 border-b flex items-center justify-between">
                <input 
                  type="text" 
                  value={search} 
                  onChange={e => setSearch(e.target.value)} 
                  placeholder="Search item code or name..." 
                  className="px-3 py-1.5 border rounded-lg text-xs w-64 focus:outline-none"
                />
                <span className="text-xs font-mono text-slate-500">{filtered.length} of {items.length} items</span>
              </div>
              <div className="overflow-x-auto flex-1 max-h-[500px]">
                <table className="w-full text-xs text-left">
                  <thead className="bg-slate-50 text-slate-700 border-b sticky top-0">
                    <tr>
                      <th className="py-2.5 px-3">Item Code</th>
                      <th className="py-2.5 px-3">Item Name</th>
                      <th className="py-2.5 px-3">Category</th>
                      <th className="py-2.5 px-3">Unit</th>
                      <th className="py-2.5 px-3 text-right">Price</th>
                      {isCentralAdmin && <th className="py-2.5 px-3 text-right">Action</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filtered.length === 0 ? (
                      <tr><td colSpan="6" className="py-8 text-center text-slate-400">No items registered. Import Excel template or add an item.</td></tr>
                    ) : (
                      filtered.map(i => (
                        <tr key={i.id} className="hover:bg-slate-50">
                          <td className="py-2.5 px-3 font-mono font-bold text-slate-900">{i.itemCode}</td>
                          <td className="py-2.5 px-3 text-slate-800">{i.itemName}</td>
                          <td className="py-2.5 px-3 text-slate-600">{i.category}</td>
                          <td className="py-2.5 px-3 text-slate-600">{i.unit}</td>
                          <td className="py-2.5 px-3 text-right font-mono">Rs. {i.unitPrice}</td>
                          {isCentralAdmin && (
                            <td className="py-2.5 px-3 text-right">
                              <button onClick={() => {
                                if (confirm(`Delete ${i.itemCode}?`)) {
                                  onUpdateItems(items.filter(x => x.id !== i.id));
                                }
                              }} className="text-rose-600 hover:underline">Delete</button>
                            </td>
                          )}
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- MAIN STOCK INBOUND & RECEIPT PRINTING WITH DETAILED ITEM INWARD LEDGER ---
    function MainStockView({ items, entries, onUpdateEntries, isCentralAdmin, getMainStock, addAudit, siteReturns, onOpenPrintForInward, currentUser }) {
      const [showModal, setShowModal] = useState(false);
      const [filterAvailable, setFilterAvailable] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedItemId, setSelectedItemId] = useState(items[0]?.id || '');
      const [qty, setQty] = useState('');
      const [refNo, setRefNo] = useState('PO-' + Math.floor(1000 + Math.random() * 9000));
      const [supplier, setSupplier] = useState('');
      const [supplierInvoiceNo, setSupplierInvoiceNo] = useState('');
      const [inwardDate, setInwardDate] = useState(() => new Date().toISOString().split('T')[0]);
      const [receivedBy, setReceivedBy] = useState(() => currentUser?.fullName || 'Arthur Vance');
      const [notes, setNotes] = useState('');

      // Modal state for viewing inward receipt ledger of a specific item (User Request: "item eka click karapuwama ekata badu apu dates,qty,supplier,sup inv number,okkoma balanda view details kiyala button ekak danda")
      const [itemForDetails, setItemForDetails] = useState(null);
      const [inwardSearch, setInwardSearch] = useState('');
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);

      const filteredItems = items.filter(i => {
        if (filterAvailable && getMainStock(i.id).availableBalance <= 0) return false;
